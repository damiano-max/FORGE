<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>FORGE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style></head><body><iframe id="forge" src="index.html?v=12-inner"></iframe><script>(function(){const f=document.getElementById('forge');function install(){let d;try{d=f.contentDocument}catch(e){return}if(!d||!d.body)return;if(!d.getElementById('forgeSwipeStyle')){const s=d.createElement('style');s.id='forgeSwipeStyle';s.textContent='.set{touch-action:pan-y;transition:transform .18s ease,background .18s ease}.set.forge-swiping{transform:translateX(-80px);background:#ffe5e7}';d.head.appendChild(s)}if(d.documentElement.dataset.forgeSwipeInstalled)return;d.documentElement.dataset.forgeSwipeInstalled='1';let active=null,sx=0,sy=0,moved=false;d.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const row=e.target.closest&&e.target.closest('.set');if(!row)return;active=row;sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false},{passive:true});d.addEventListener('touchmove',e=>{if(!active||e.touches.length!==1)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dy)>Math.abs(dx)+8){active.classList.remove('forge-swiping');return}if(dx<0){moved=true;active.classList.add('forge-swiping');if(Math.abs(dx)>10)e.preventDefault()}else active.classList.remove('forge-swiping')},{passive:false});d.addEventListener('touchend',e=>{if(!active)return;const row=active;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY;active=null;sx=sy=0;row.classList.remove('forge-swiping');if(!moved||dx>-70||Math.abs(dy)>Math.abs(dx))return;try{const win=f.contentWindow;const exEl=row.closest('.ex');const ex=[...d.querySelectorAll('.ex')].indexOf(exEl);const rows=[...exEl.querySelectorAll('.set')];const si=rows.indexOf(row);if(win.state&&win.state.workout&&ex>=0&&si>=0){win.state.workout.exercises[ex].sets.splice(si,1);win.render()}}catch(err){console.error(err)}});d.addEventListener('touchcancel',()=>{if(active)active.classList.remove('forge-swiping');active=null;sx=sy=0},{passive:true})}f.addEventListener('load',()=>setTimeout(install,100));if(f.contentDocument&&f.contentDocument.readyState==='complete')setTimeout(install,100)})();</script></body></html>
