<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>FORGE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style></head><body><iframe id="forge" src="index.html?v=11-inner"></iframe><script>(function(){const f=document.getElementById('forge');let timer;function install(){let d;try{d=f.contentDocument}catch(e){return}if(!d||!d.body)return;if(!d.getElementById('forgeSwipeStyle')){const s=d.createElement('style');s.id='forgeSwipeStyle';s.textContent='.set{touch-action:pan-y;transition:transform .18s ease,background .18s ease}.set.forge-swiping{transform:translateX(-90px);background:#ffe5e7}';d.head.appendChild(s)}d.querySelectorAll('.set').forEach(row=>{if(row.dataset.forgeSwipe)return;row.dataset.forgeSwipe='1';let sx=0,sy=0,moved=false;row.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;if(e.target.closest('input,button'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false},{passive:true});row.addEventListener('touchmove',e=>{if(!sx)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dy)>Math.abs(dx)+8)return;if(dx<0){moved=true;row.classList.add('forge-swiping')}else{row.classList.remove('forge-swiping')}},{passive:true});row.addEventListener('touchend',e=>{if(!sx)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=sy=0;row.classList.remove('forge-swiping');if(!moved||dx>-90||Math.abs(dy)>Math.abs(dx))return;try{const win=f.contentWindow;const ex=[...d.querySelectorAll('.ex')].indexOf(row.closest('.ex'));const rows=[...row.closest('.ex').querySelectorAll('.set')];const si=rows.indexOf(row);if(win.state&&win.state.workout&&ex>=0&&si>=0){win.state.workout.exercises[ex].sets.splice(si,1);win.render()}}catch(err){}});})}timer=setTimeout(install,150);if(window.MutationObserver){const mo=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(install,50)});try{mo.observe(d.body,{childList:true,subtree:true})}catch(e){}}}f.addEventListener('load',install);})();</script></body></html>
