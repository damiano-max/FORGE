<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><title>FORGE — Gym Tracker</title><style>
:root{--bg:#f7f7f9;--card:#fff;--text:#111216;--muted:#747982;--line:#e5e7eb;--blue:#2998f4;--blueSoft:#eaf5ff;--green:#20c86b;--red:#ff5964;--redSoft:#fff0f1;--accent:#b8ff3d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 16px calc(35px + env(safe-area-inset-bottom))}.dark{--bg:#08090c;--card:#12141a;--text:#f5f7fb;--muted:#8e95a3;--line:#272b35;background:radial-gradient(circle at 50% -10%,#20261a 0,#0b0c10 32%,#08090c 70%)}header{display:flex;justify-content:space-between;align-items:center;padding:20px 2px 18px}.logo{font-size:25px;font-weight:900;letter-spacing:3px}.avatar{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--card)}h1{font-size:31px;line-height:1.05;margin:8px 0 7px}.sub{color:var(--muted);font-size:15px;margin-bottom:20px}.hero{background:linear-gradient(145deg,#171c12,#10130e);border:1px solid #303826;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 16px 40px #0005}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--accent);font-weight:800}.hero h2{margin:8px 0 5px;font-size:22px}.hero p{margin:0 0 18px;color:#aeb4bd}.primary{width:100%;padding:16px;border-radius:15px;background:var(--accent);color:#0a0d07;font-weight:900;font-size:16px}.secondary{padding:12px 15px;border-radius:13px;background:#181b23;color:#fff;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 22px}.stat,.template,.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:15px}.stat b{display:block;font-size:21px}.stat span{color:var(--muted);font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 10px}.section-title h3{margin:0;font-size:17px}.muted{color:var(--muted)}.templates{display:grid;gap:10px}.template{padding:16px;display:flex;align-items:center;justify-content:space-between}.template strong{display:block}.template small{color:var(--muted)}nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0a0b0ed9;backdrop-filter:blur(18px);border-top:1px solid #272b35;display:flex;justify-content:space-around}nav button{background:none;color:#8e95a3;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center}nav button.active{color:var(--accent)}nav i{font-style:normal;font-size:20px}
/* Workout screen inspired by the clean Strong-style layout */.workout-screen{background:#fff;min-height:100vh;color:#111}.workout-screen .app{padding:calc(8px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));max-width:560px}.workout-top{display:grid;grid-template-columns:64px 1fr 110px;align-items:center;padding:8px 0 22px}.icon-btn{width:58px;height:58px;border-radius:16px;background:#eceef0;color:#30343a;font-size:28px;display:grid;place-items:center}.finish-btn{height:58px;border-radius:16px;background:var(--green);color:#fff;font-size:18px;font-weight:800}.drag{width:44px;height:6px;border-radius:9px;background:#d0d2d4;justify-self:center}.workout-title{display:flex;align-items:center;gap:10px;margin:15px 0 20px}.workout-title h1{font-size:39px;letter-spacing:-1.5px;margin:0;font-weight:800}.more{width:58px;height:48px;border-radius:15px;background:var(--blueSoft);color:var(--blue);font-size:25px}.meta{display:grid;gap:15px;margin-bottom:76px}.meta-row{display:flex;align-items:center;gap:15px;color:#666c73;font-size:21px}.meta-icon{font-size:28px;width:38px;text-align:center}.add-main{width:100%;height:74px;border-radius:17px;background:var(--blueSoft);color:var(--blue);font-size:21px;font-weight:750;margin-bottom:18px}.cancel{width:100%;height:74px;border-radius:17px;background:var(--redSoft);color:var(--red);font-size:21px;font-weight:750}.empty-workout{text-align:center;padding:0;margin:0}.empty-workout p{display:none}.exercise-card{border-top:1px solid #e8e8ea;padding:22px 0 8px;margin-bottom:8px}.exercise-card h2{font-size:25px;margin:0 0 16px}.set-row{display:grid;grid-template-columns:36px 1fr 1fr 54px;gap:8px;align-items:center;margin:8px 0}.set-no{color:#8a8f96;text-align:center;font-size:14px}.field{width:100%;background:#f4f5f6;border:1px solid #e0e2e5;border-radius:11px;padding:12px;color:#111;text-align:center;outline:none;font-size:17px}.check{width:48px;height:44px;border-radius:12px;background:#eceef0;color:#8b9096;font-size:20px}.check.done{background:var(--green);color:#fff}.addset{background:none;color:var(--blue);font-weight:700;padding:9px 0}.workout-screen .toast{position:fixed;z-index:30;bottom:25px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:13px;font-weight:750;box-shadow:0 10px 30px #0003}.overlay{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:end}.sheet{width:min(560px,100%);background:#fff;border-radius:25px 25px 0 0;padding:20px 16px calc(25px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}.sheet h2{margin:3px 0 14px;font-size:25px}.search{width:100%;background:#f2f3f5;border:0;border-radius:13px;padding:14px;margin-bottom:10px;outline:none}.exercise-option{width:100%;text-align:left;background:#f4f5f6;padding:15px;border-radius:13px;margin:5px 0;color:#111}.exercise-option small{display:block;color:#777;margin-top:3px}.progress-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:10px 0}.big{font-size:32px;font-weight:900}.bar{height:9px;background:#242833;border-radius:99px;overflow:hidden;margin-top:12px}.bar div{height:100%;background:var(--accent);width:72%}
</style></head><body><div id="app"></div><script>
const exercises=[["Panca piana bilanciere","Petto"],["Panca inclinata bilanciere","Petto"],["Panca inclinata manubri","Petto"],["Chest press","Petto"],["Pec deck","Petto"],["Croci ai cavi","Petto"],["Dip","Petto"],["Trazioni","Dorso"],["Lat machine","Dorso"],["Rematore bilanciere","Dorso"],["Pulley basso","Dorso"],["Military press","Spalle"],["Alzate laterali manubri","Spalle"],["Curl bilanciere","Bicipiti"],["Hammer curl","Bicipiti"],["Pushdown corda","Tricipiti"],["French press","Tricipiti"],["Squat","Gambe"],["Leg press","Gambe"],["Hack squat","Gambe"],["Stacco rumeno","Femorali"],["Hip thrust","Glutei"],["Calf raise in piedi","Polpacci"],["Crunch ai cavi","Addome"]];
let state={screen:"home",workout:null,rest:0,restInterval:null};let history=JSON.parse(localStorage.getItem("forge_history")||"[]");
function save(){localStorage.setItem("forge_history",JSON.stringify(history))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function volume(){return history.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+(+s.kg||0)*(+s.reps||0),0),0)}
function render(){let a=document.getElementById("app");a.innerHTML=state.screen==="home"?home():state.screen==="workout"?workout():state.screen==="progress"?progress():profile();if(state.screen!=="workout")nav()}
function nav(){document.getElementById("app").insertAdjacentHTML("beforeend",`<nav><button class="${state.screen==="home"?"active":""}" onclick="go('home')"><i>⌂</i>Home</button><button class="${state.screen==="progress"?"active":""}" onclick="go('progress')"><i>↗</i>Progressi</button><button class="${state.screen==="profile"?"active":""}" onclick="go('profile')"><i>⚙</i>Profilo</button></nav>`)}
function header(){return`<header><div class="logo">FORGE</div><div class="avatar">D</div></header>`}
function home(){return`<div class="app dark">${header()}<h1>Pronto a spingere?</h1><div class="sub">Il tuo prossimo allenamento, senza perdere tempo.</div><div class="hero"><div class="eyebrow">Prossimo allenamento</div><h2>Push A</h2><p>Petto · Spalle · Tricipiti</p><button class="primary" onclick="startWorkout('Nuovo allenamento')">▶ Inizia allenamento</button></div><div class="stats"><div class="stat"><b>${history.length}</b><span>Workout</span></div><div class="stat"><b>${volume()}</b><span>kg volume</span></div><div class="stat"><b>0</b><span>PR</span></div></div><div class="section-title"><h3>I tuoi template</h3><button class="secondary" onclick="toast('Creazione template in arrivo')">＋</button></div><div class="templates">${["Push A","Pull A","Legs A","Upper B"].map(x=>`<div class="template"><div><strong>${x}</strong><small>Template allenamento</small></div><button class="secondary" onclick="startWorkout('${x}')">▶</button></div>`).join("")}</div></div>`}
function startWorkout(name="Nuovo allenamento"){state.workout={name,started:Date.now(),exercises:[]};state.screen="workout";render()}
function workout(){let w=state.workout;return`<div class="workout-screen"><div class="app"><div class="workout-top"><button class="icon-btn" onclick="confirmExit()">↶</button><div class="drag"></div><button class="finish-btn" onclick="finishWorkout()">Termina</button></div><div class="workout-title"><h1>${esc(w.name)}</h1><button class="more" onclick="toast('Opzioni allenamento in arrivo')">•••</button></div><div class="meta"><div class="meta-row"><span class="meta-icon">▣</span><span>${new Date().toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</span></div><div class="meta-row"><span class="meta-icon">◷</span><span id="elapsed">${fmt(Math.floor((Date.now()-w.started)/1000))}</span></div></div>${w.exercises.length?`<div>${w.exercises.map((e,ei)=>card(e,ei)).join('')}</div>`:`<div class="empty-workout"></div>`}<button class="add-main" onclick="openLibrary()">Aggiungi esercizi</button><button class="cancel" onclick="cancelWorkout()">Annulla allenamento</button></div>${state.rest>0?`<div class="toast">Recupero ${fmt(state.rest)}</div>`:''}</div>`}
function card(e,ei){return`<div class="exercise-card"><h2>${esc(e.name)}</h2><div class="set-row" style="color:#8a8f96;font-size:12px"><span></span><span style="text-align:center">KG</span><span style="text-align:center">RIP</span><span></span></div>${e.sets.map((s,si)=>`<div class="set-row"><span class="set-no">${si+1}</span><input class="field" type="number" step="0.5" value="${s.kg}" onchange="upd(${ei},${si},'kg',this.value)"><input class="field" type="number" value="${s.reps}" onchange="upd(${ei},${si},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':'○'}</button></div>`).join('')}<button class="addset" onclick="addSet(${ei})">＋ Aggiungi serie</button></div>`}
function upd(ei,si,k,v){state.workout.exercises[ei].sets[si][k]=v}function addSet(ei){let s=state.workout.exercises[ei].sets.at(-1);state.workout.exercises[ei].sets.push({kg:s?.kg||0,reps:s?.reps||8,done:false});render()}function toggleSet(ei,si){state.workout.exercises[ei].sets[si].done=!state.workout.exercises[ei].sets[si].done;if(state.workout.exercises[ei].sets[si].done)startRest(90);render()}
function removeExercise(ei){state.workout.exercises.splice(ei,1);render()}function cancelWorkout(){state.rest=0;clearInterval(state.restInterval);state.workout=null;state.screen='home';render()}
function finishWorkout(){if(!state.workout)return;let sets=state.workout.exercises.flatMap(e=>e.sets.filter(s=>s.done));if(!sets.length){toast('Aggiungi e completa almeno una serie');return}history.push({...state.workout,sets,date:new Date().toISOString()});save();state.rest=0;state.workout=null;state.screen='home';render();toast('Allenamento salvato ✓')}
function startRest(sec){clearInterval(state.restInterval);state.rest=sec;state.restInterval=setInterval(()=>{state.rest--;if(state.rest<=0){clearInterval(state.restInterval);state.rest=0;toast('Recupero terminato 🔥')}},1000)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function openLibrary(){document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="lib"><div class="sheet"><div class="section-title"><h2>Aggiungi esercizio</h2><button class="back" onclick="closeLib()">Chiudi</button></div><input class="search" placeholder="Cerca esercizio..." oninput="filterLib(this.value)" id="libsearch"><div id="liblist">${libraryItems(exercises)}</div></div></div>`)}
function libraryItems(arr){return arr.map(e=>`<button class="exercise-option" onclick="pickExercise(${exercises.indexOf(e)})"><strong>${esc(e[0])}</strong><small>${e[1]}</small></button>`).join('')}function filterLib(q){document.getElementById('liblist').innerHTML=libraryItems(exercises.filter(e=>e[0].toLowerCase().includes(q.toLowerCase())||e[1].toLowerCase().includes(q.toLowerCase())))}function pickExercise(i){state.workout.exercises.push({name:exercises[i][0],sets:[{kg:0,reps:8,done:false},{kg:0,reps:8,done:false},{kg:0,reps:8,done:false}]});closeLib();render()}function closeLib(){document.getElementById('lib')?.remove()}
function progress(){return`<div class="app dark">${header()}<h1>Progressi</h1><div class="sub">Trasforma ogni allenamento in progresso.</div><div class="progress-card"><div class="muted">Volume totale</div><div class="big">${volume()} kg</div><div class="bar"><div></div></div></div><div class="progress-card"><div class="muted">Allenamenti completati</div><div class="big">${history.length}</div></div><div class="section-title"><h3>Storico</h3></div>${history.length?history.slice().reverse().map(w=>`<div class="template"><div><strong>${esc(w.name)}</strong><small>${new Date(w.date).toLocaleDateString('it-IT')} · ${w.sets.length} serie</small></div><span>${w.sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0)} kg</span></div>`).join(''):`<div class="muted">Ancora nessun allenamento.</div>`}</div>`}
function profile(){return`<div class="app dark">${header()}<h1>Profilo</h1><div class="sub">Le impostazioni di FORGE.</div><div class="progress-card"><strong>FORGE Pro</strong><p class="muted">Progressione intelligente, analisi avanzate e AI Coach.</p><button class="primary" onclick="toast('Pro arriverà nella prossima versione')">Scopri Pro</button></div><div class="progress-card"><strong>Dati locali</strong><p class="muted">Questa beta salva i workout sul dispositivo.</p></div></div>`}
function confirmExit(){if(confirm('Uscire dall’allenamento?'))cancelWorkout()}function go(s){state.screen=s;render()}function toast(t){let x=document.querySelector('.toast');if(x)x.remove();x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}render();setInterval(()=>{if(state.screen==='workout'&&state.workout){let e=document.getElementById('elapsed');if(e)e.textContent=fmt(Math.floor((Date.now()-state.workout.started)/1000))}},1000);
</script></body></html>
