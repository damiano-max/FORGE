<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>FORGE</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#171a1d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:600px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}.homeTop{height:82px;display:flex;justify-content:flex-end;align-items:center}.search{font-size:38px;color:#299cf4}.title{font-size:42px;letter-spacing:-2px;margin:28px 0 42px;font-weight:800}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.head h2{font-size:28px;margin:0}.quick{width:100%;height:76px;border:0;border-radius:17px;background:#299cf4;color:#fff;font-size:21px;font-weight:750;margin-bottom:54px}.actions{display:flex;gap:8px}.pill,.ibox,.dots{height:50px;border:0;border-radius:14px;background:#eaf5ff;color:#299cf4;font-weight:750}.pill{padding:0 16px;font-size:19px}.ibox,.dots{width:52px;font-size:24px}.sub{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.sub h3{font-size:21px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 26px;margin-bottom:54px}.tpl{min-height:210px;border:1px solid #e4e6e8;border-radius:27px;padding:24px 20px;position:relative}.tpl .dots{position:absolute;right:15px;top:15px}.tpl h4{font-size:23px;line-height:1.15;margin:12px 45px 12px 0}.tpl p{font-size:17px;color:#687078;line-height:1.3;margin:0 0 18px}.ago{color:#666;font-size:16px}.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;height:94px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#263139;display:grid;grid-template-columns:repeat(5,1fr)}.bottom button{border:0;background:none;color:#9fa4a8;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom .active{color:#fff}.ico{font-size:31px;line-height:32px}.plus{font-size:47px;line-height:30px}.workout{min-height:100vh;background:#fff}.top{display:grid;grid-template-columns:64px 1fr 105px;align-items:center;padding:8px 0 20px}.back{width:58px;height:58px;border:0;border-radius:16px;background:#eceef0;font-size:28px}.drag{width:44px;height:6px;border-radius:9px;background:#d0d2d4;justify-self:center}.finish{height:58px;border:0;border-radius:16px;background:#20c86b;color:#fff;font-size:18px;font-weight:800}.wtitle{display:flex;align-items:center;gap:10px;margin:92px 0 20px}.wtitle h1{font-size:39px;letter-spacing:-1.6px;margin:0;font-weight:800}.more{width:58px;height:48px;border:0;border-radius:15px;background:#eaf5ff;color:#299cf4;font-size:24px}.meta{display:grid;gap:14px;margin-bottom:54px;color:#666c73;font-size:21px}.metaRow{display:flex;align-items:center;gap:15px}.metaIcon{font-size:27px;width:38px;text-align:center}.ex{border-top:1px solid #e8e8ea;padding:22px 0 8px}.exHead{display:flex;align-items:center;justify-content:space-between}.ex h2{font-size:25px;color:#299cf4;margin:0 0 18px}.linkbtn{border:0;background:#eaf5ff;color:#299cf4;border-radius:13px;height:48px;padding:0 15px;font-size:20px}.cols,.set{display:grid;grid-template-columns:42px 1.25fr 1fr 1fr 54px;gap:8px;align-items:center}.cols{font-size:16px;font-weight:700;margin-bottom:8px}.cols span{text-align:center}.set{margin:8px 0}.setno{background:#eceef0;border-radius:12px;padding:11px 0;text-align:center}.field{width:100%;background:#f1f2f3;border:1px solid #e0e2e5;border-radius:11px;padding:11px 6px;text-align:center;font-size:17px}.prev{text-align:center;color:#666;font-size:16px}.check{width:48px;height:44px;border:0;border-radius:12px;background:#eceef0;font-size:21px}.check.done{background:#20c86b;color:#fff}.rest{display:flex;align-items:center;gap:8px;color:#299cf4;font-size:20px;margin:8px 0}.rest:before,.rest:after{content:"";height:7px;border-radius:8px;background:#eaf5ff;flex:1}.addset{width:100%;height:51px;border:0;border-radius:13px;background:#eceef0;color:#292e33;font-size:18px;font-weight:700;margin:10px 0 25px}.addMain,.cancel{width:100%;height:74px;border:0;border-radius:17px;font-size:21px;font-weight:750;margin-top:14px}.addMain{background:#eaf5ff;color:#299cf4}.cancel{background:#fff0f1;color:#ff5964}.lib{min-height:100vh;background:#fff}.libTop{display:flex;align-items:center;justify-content:space-between;padding:12px 0 18px}.libTop h1{font-size:30px;margin:0}.close{width:48px;height:48px;border:0;border-radius:14px;background:#eceef0;font-size:28px}.libSearch{width:100%;height:58px;border:0;border-radius:15px;background:#f0f1f3;padding:0 18px;font-size:19px;outline:none;margin-bottom:14px}.filters{display:grid;grid-template-columns:1fr 1fr 58px;gap:10px;margin-bottom:12px}.filter,.sort{height:58px;border:0;border-radius:14px;background:#e9eaec;font-size:16px;font-weight:700}.sort{background:#299cf4;color:#fff;font-size:25px}.item{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #e6e7e9;padding:12px 4px;display:grid;grid-template-columns:1fr 42px;align-items:center;min-height:76px}.item strong{font-size:18px}.item small{display:block;color:#697078;font-size:16px;margin-top:4px}.q{width:40px;height:40px;border:0;border-radius:12px;background:#eaf5ff;color:#299cf4;font-size:23px}.toast{position:fixed;z-index:50;bottom:110px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:13px;font-weight:700}</style></head><body><div id="app"></div><script>
const exercises=[["Panca piana bilanciere","Petto"],["Panca inclinata bilanciere","Petto"],["Panca inclinata manubri","Petto"],["Chest press","Petto"],["Pec deck","Petto"],["Croci ai cavi","Petto"],["Dip","Petto"],["Trazioni","Dorso"],["Lat machine","Dorso"],["Rematore bilanciere","Dorso"],["Pulley basso","Dorso"],["Military press","Spalle"],["Alzate laterali manubri","Spalle"],["Curl bilanciere","Bicipiti"],["Hammer curl","Bicipiti"],["Pushdown corda","Tricipiti"],["French press","Tricipiti"],["Squat","Gambe"],["Leg press","Gambe"],["Hack squat","Gambe"],["Stacco rumeno","Femorali"],["Hip thrust","Glutei"],["Calf raise in piedi","Polpacci"],["Crunch ai cavi","Addome"]];
const templates=[{name:"Spalle Petto Bicipiti",desc:"Overhead Press (Smith Machine), Lateral Raise (Dumbbell), Bench Press...",ago:"13 giorni fa"},{name:"Dorso Tricipiti Gambe",desc:"Lat Pulldown (Cable), Bent Over Row (Barbell), Leg Extension...",ago:"10 giorni fa"},{name:"Petto Spalle Bicipiti",desc:"Bench Press (Barbell), Incline Bench Press (Dumbbell), Lateral Raise...",ago:"8 giorni fa"},{name:"Gambe Dorso Tricipiti",desc:"Squat (Smith Machine), Leg Extension (Machine)...",ago:"15 giorni fa"}];let state={screen:"home",workout:null,rest:0,restInterval:null};let history=JSON.parse(localStorage.getItem("forge_history")||"[]");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function save(){localStorage.setItem("forge_history",JSON.stringify(history))}function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function toast(t){let x=document.querySelector('.toast');if(x)x.remove();x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1700)}
function render(){document.getElementById('app').innerHTML=state.screen==='home'?home():state.screen==='workout'?workout():library();if(state.screen==='home')nav()}
function home(){return `<div class="app"><div class="homeTop"><div class="search">⌕</div></div><h1 class="title">Inizia allenamento</h1><div class="head"><h2>Avvio rapido</h2></div><button class="quick" onclick="startWorkout()">Inizia un allenamento vuoto</button><div class="head"><h2>Modelli</h2><div class="actions"><button class="pill">＋ Template</button><button class="ibox">▣</button><button class="dots">•••</button></div></div><div class="sub"><h3>My Templates (4)</h3><button class="dots">•••</button></div><div class="grid">${templates.map(t=>`<div class="tpl"><button class="dots">•••</button><h4>${esc(t.name)}</h4><p>${esc(t.desc)}</p><div class="ago">◷ ${t.ago}</div></div>`).join('')}</div><div class="sub"><h3>Example Templates (5)</h3></div></div>`}
function nav(){document.body.insertAdjacentHTML('beforeend',`<div class="bottom"><button onclick="toast('Profilo in arrivo')"><span class="ico">●</span>Profilo</button><button onclick="toast('Storico in arrivo')"><span class="ico">◷</span>Storico</button><button class="active" onclick="startWorkout()"><span class="plus">＋</span>Inizia allenamento</button><button onclick="state.screen='library';render()"><span class="ico">▥</span>Esercizi</button><button onclick="toast('Misure in arrivo')"><span class="ico">⌁</span>Misura</button></div>`)}
function startWorkout(){state.workout={name:'Allenamento serale',started:Date.now(),exercises:[]};state.screen='workout';render()}
function workout(){let w=state.workout;return `<div class="workout"><div class="app"><div class="top"><button class="back" onclick="cancelWorkout()">↶</button><div class="drag"></div><button class="finish" onclick="finishWorkout()">Termina</button></div><div class="wtitle"><h1>${esc(w.name)}</h1><button class="more">•••</button></div><div class="meta"><div class="metaRow"><span class="metaIcon">▣</span>${new Date().toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</div><div class="metaRow"><span class="metaIcon">◷</span><span id="elapsed">${fmt(Math.floor((Date.now()-w.started)/1000))}</span></div></div>${w.exercises.map((e,i)=>exerciseCard(e,i)).join('')}<button class="addMain" onclick="openLibrary()">Aggiungi esercizi</button><button class="cancel" onclick="cancelWorkout()">Annulla allenamento</button></div></div>`}
function exerciseCard(e,ei){return `<div class="ex"><div class="exHead"><h2>${esc(e.name)}</h2><button class="linkbtn">•••</button></div><div class="cols"><span>Serie</span><span>Precedente</span><span>kg</span><span>Rip.</span><span>✓</span></div>${e.sets.map((s,si)=>`<div class="set"><span class="setno">${si+1}</span><span class="prev">${s.prev||'—'}</span><input class="field" type="number" step="0.5" value="${s.kg}" onchange="upd(${ei},${si},'kg',this.value)"><input class="field" type="number" value="${s.reps}" onchange="upd(${ei},${si},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">✓</button></div>${s.done?'<div class="rest">2:00</div>':''}`).join('')}<button class="addset" onclick="addSet(${ei})">＋ Aggiungi serie (2:00)</button></div>`}
function upd(ei,si,k,v){state.workout.exercises[ei].sets[si][k]=v}function addSet(ei){let s=state.workout.exercises[ei].sets.at(-1)||{};state.workout.exercises[ei].sets.push({kg:s.kg||0,reps:s.reps||8,prev:(s.kg||s.reps)?s.kg+' kg × '+s.reps:'—',done:false});render()}function toggleSet(ei,si){state.workout.exercises[ei].sets[si].done=!state.workout.exercises[ei].sets[si].done;if(state.workout.exercises[ei].sets[si].done)startRest(120);render()}function startRest(sec){clearInterval(state.restInterval);state.rest=sec;state.restInterval=setInterval(()=>{state.rest--;if(state.rest<=0){clearInterval(state.restInterval);state.rest=0;toast('Recupero terminato 🔥')}},1000)}
function finishWorkout(){let sets=state.workout.exercises.flatMap(e=>e.sets.filter(s=>s.done));if(!sets.length){toast('Completa almeno una serie');return}history.push({...state.workout,sets,date:new Date().toISOString()});save();cancelWorkout();toast('Allenamento salvato ✓')}function cancelWorkout(){clearInterval(state.restInterval);state.workout=null;state.screen='home';render()}
function openLibrary(){state.screen='library';render()}function library(){return `<div class="lib"><div class="app"><div class="libTop"><h1>Aggiungi esercizio</h1><button class="close" onclick="state.screen='workout';render()">×</button></div><input class="libSearch" placeholder="Ricerca" oninput="filterLibrary(this.value)"><div class="filters"><button class="filter">Qualsiasi parte del corpo</button><button class="filter">Qualsiasi categoria</button><button class="sort">↕</button></div><div id="libList">${items(exercises)}</div></div></div>`}function items(arr){return arr.map(e=>`<button class="item" onclick="pick(${exercises.indexOf(e)})"><div><strong>${esc(e[0])}</strong><small>${e[1]}</small></div><span class="q">?</span></button>`).join('')}function filterLibrary(q){document.getElementById('libList').innerHTML=items(exercises.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(q.toLowerCase())))}function pick(i){if(state.workout){state.workout.exercises.push({name:exercises[i][0],sets:[{kg:0,reps:8,prev:'—',done:false}]});state.screen='workout';render()}}render();setInterval(()=>{if(state.screen==='workout'&&state.workout){let e=document.getElementById('elapsed');if(e)e.textContent=fmt(Math.floor((Date.now()-state.workout.started)/1000))}},1000);
</script></body></html>
