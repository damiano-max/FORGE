<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>FORGE</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#171a1d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:600px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}.title{font-size:42px;letter-spacing:-2px;margin:55px 0 42px;font-weight:800}.quick,.addMain{width:100%;height:76px;border:0;border-radius:17px;background:#299cf4;color:#fff;font-size:21px;font-weight:750}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.head h2{font-size:28px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tpl{min-height:190px;border:1px solid #e4e6e8;border-radius:27px;padding:20px}.tpl h4{font-size:22px}.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;height:94px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#263139;display:grid;grid-template-columns:repeat(5,1fr)}.bottom button{border:0;background:none;color:#9fa4a8;font-size:13px}.bottom .active{color:#fff}.workout{min-height:100vh}.top{display:grid;grid-template-columns:58px 1fr 105px;gap:8px;align-items:center;padding:8px 0 20px}.back,.finish,.more,.linkbtn,.addset,.check{border:0;border-radius:13px}.back{height:56px;background:#eceef0;font-size:28px}.finish{height:56px;background:#20c86b;color:#fff;font-weight:800}.wtitle{display:flex;align-items:center;gap:10px;margin:70px 0 20px}.wtitle h1{font-size:39px;margin:0}.more{width:55px;height:48px;background:#eaf5ff;color:#299cf4}.meta{display:grid;gap:14px;margin-bottom:45px;color:#666;font-size:20px}.ex{border-top:1px solid #e8e8ea;padding:22px 0 8px}.ex h2{font-size:25px;color:#299cf4}.cols,.set{display:grid;grid-template-columns:42px 1.25fr 1fr 1fr 54px;gap:8px;align-items:center}.cols{font-size:14px;font-weight:700}.cols span{text-align:center}.set{margin:8px 0;touch-action:pan-y;transition:transform .16s ease,opacity .16s ease}.set.swiping{transform:translateX(-75px);opacity:.55}.setno{background:#eceef0;border-radius:12px;padding:11px 0;text-align:center}.field{width:100%;background:#f1f2f3;border:1px solid #e0e2e5;border-radius:11px;padding:11px 6px;text-align:center;font-size:17px}.prev{text-align:center;color:#666;font-size:15px}.check{width:48px;height:44px;background:#eceef0;font-size:21px}.check.done{background:#20c86b;color:#fff}.addset{width:100%;height:51px;background:#eceef0;font-size:18px;font-weight:700;margin:10px 0 25px}.addMain{margin-top:15px;color:#fff}.cancel{width:100%;height:70px;border:0;border-radius:17px;background:#fff0f1;color:#ff5964;font-size:20px;font-weight:750;margin-top:14px}.libSearch{width:100%;height:58px;border:0;border-radius:15px;background:#f0f1f3;padding:0 18px;font-size:19px;margin:15px 0}.item{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #e6e7e9;padding:14px 4px;min-height:70px}.item strong{font-size:18px}.item small{display:block;color:#697078;margin-top:4px}.toast{position:fixed;z-index:50;bottom:110px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:13px;font-weight:700}</style></head><body><div id="app"></div><script>const exercises=[["Panca piana bilanciere","Petto"],["Panca inclinata bilanciere","Petto"],["Panca inclinata manubri","Petto"],["Chest press","Petto"],["Pec deck","Petto"],["Croci ai cavi","Petto"],["Dip","Petto"],["Trazioni","Dorso"],["Lat machine","Dorso"],["Rematore bilanciere","Dorso"],["Pulley basso","Dorso"],["Military press","Spalle"],["Alzate laterali manubri","Spalle"],["Curl bilanciere","Bicipiti"],["Hammer curl","Bicipiti"],["Pushdown corda","Tricipiti"],["French press","Tricipiti"],["Squat","Gambe"],["Leg press","Gambe"],["Hack squat","Gambe"],["Stacco rumeno","Femorali"],["Hip thrust","Glutei"],["Calf raise in piedi","Polpacci"],["Crunch ai cavi","Addome"]];const templates=["Spalle Petto Bicipiti","Dorso Tricipiti Gambe","Petto Spalle Bicipiti","Gambe Dorso Tricipiti"];let state={screen:'home',workout:null};let history=JSON.parse(localStorage.getItem('forge_history')||'[]');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1400)}function render(){app.innerHTML=state.screen==='home'?home():state.screen==='workout'?workout():library();if(state.screen==='home')nav()}function home(){return `<div class="app"><h1 class="title">Inizia allenamento</h1><div class="head"><h2>Avvio rapido</h2></div><button class="quick" onclick="startWorkout()">Inizia un allenamento vuoto</button><div class="head" style="margin-top:50px"><h2>Modelli</h2></div><div class="grid">${templates.map(x=>`<div class="tpl"><h4>${x}</h4><p>Bench Press, Lateral Raise, Lat Pulldown...</p></div>`).join('')}</div></div>`}function nav(){document.body.insertAdjacentHTML('beforeend',`<div class="bottom"><button>●<br>Profilo</button><button>◷<br>Storico</button><button class="active" onclick="startWorkout()">＋<br>Inizia allenamento</button><button onclick="state.screen='library';render()">▥<br>Esercizi</button><button>⌁<br>Misura</button></div>`)}function startWorkout(){state.workout={name:'Allenamento serale',started:Date.now(),exercises:[]};state.screen='workout';render()}function workout(){let w=state.workout;return `<div class="workout"><div class="app"><div class="top"><button class="back" onclick="cancelWorkout()">↶</button><div></div><button class="finish" onclick="finishWorkout()">Termina</button></div><div class="wtitle"><h1>${esc(w.name)}</h1><button class="more">•••</button></div><div class="meta">▣ ${new Date().toLocaleDateString('it-IT')}<br>◷ <span id="elapsed">00:00</span></div>${w.exercises.map((e,ei)=>card(e,ei)).join('')}<button class="addMain" onclick="openLibrary()">Aggiungi esercizi</button><button class="cancel" onclick="cancelWorkout()">Annulla allenamento</button></div></div>`}function card(e,ei){return `<div class="ex"><h2>${esc(e.name)}</h2><div class="cols"><span>Serie</span><span>Precedente</span><span>kg</span><span>Rip.</span><span>✓</span></div>${e.sets.map((s,si)=>`<div class="set" data-e="${ei}" data-s="${si}"><span class="setno">${si+1}</span><span class="prev">${s.prev||'—'}</span><input class="field" type="number" step="0.5" value="${s.kg}" onchange="upd(${ei},${si},'kg',this.value)"><input class="field" type="number" value="${s.reps}" onchange="upd(${ei},${si},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">✓</button></div>`).join('')}<button class="addset" onclick="addSet(${ei})">＋ Aggiungi serie (2:00)</button></div>`}function upd(ei,si,k,v){state.workout.exercises[ei].sets[si][k]=v}function addSet(ei){let a=state.workout.exercises[ei].sets,s=a[a.length-1]||{};a.push({kg:s.kg||0,reps:s.reps||8,prev:(s.kg||s.reps)?s.kg+' kg × '+s.reps:'—',done:false});render()}function toggleSet(ei,si){state.workout.exercises[ei].sets[si].done=!state.workout.exercises[ei].sets[si].done;render()}function openLibrary(){state.screen='library';render()}function library(){return `<div class="app"><div class="top"><button class="back" onclick="state.screen='workout';render()">×</button><h2>Aggiungi esercizio</h2><div></div></div><input class="libSearch" placeholder="Ricerca" oninput="filterLibrary(this.value)"><div id="list">${items(exercises)}</div></div>`}function items(a){return a.map(e=>`<button class="item" onclick="pick(${exercises.indexOf(e)})"><strong>${esc(e[0])}</strong><small>${e[1]}</small></button>`).join('')}function filterLibrary(q){list.innerHTML=items(exercises.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(q.toLowerCase())))}function pick(i){state.workout.exercises.push({name:exercises[i][0],sets:[{kg:0,reps:8,prev:'—',done:false}]});state.screen='workout';render()}function cancelWorkout(){state.workout=null;state.screen='home';render()}function finishWorkout(){let sets=state.workout.exercises.flatMap(e=>e.sets.filter(s=>s.done));if(!sets.length){toast('Completa almeno una serie');return}history.push({...state.workout,sets,date:new Date().toISOString()});localStorage.setItem('forge_history',JSON.stringify(history));cancelWorkout()}let touch=null;document.addEventListener('touchstart',e=>{let row=e.target.closest('.set');if(!row)return;touch={row,x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});document.addEventListener('touchmove',e=>{if(!touch)return;let dx=e.touches[0].clientX-touch.x,dy=e.touches[0].clientY-touch.y;if(dx<0&&Math.abs(dx)>Math.abs(dy))touch.row.classList.add('swiping');else touch.row.classList.remove('swiping')},{passive:true});document.addEventListener('touchend',e=>{if(!touch)return;let t=touch;touch=null;let dx=e.changedTouches[0].clientX-t.x,dy=e.changedTouches[0].clientY-t.y;t.row.classList.remove('swiping');if(dx<-60&&Math.abs(dx)>Math.abs(dy)*1.2){let ei=+t.row.dataset.e,si=+t.row.dataset.s;if(state.workout&&state.workout.exercises[ei]){state.workout.exercises[ei].sets.splice(si,1);render();toast('Serie eliminata')}}},{passive:true});render();</script></body></html>
