<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>FORGE</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#292e33;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:600px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(105px + env(safe-area-inset-bottom))}.home-top{height:82px;display:flex;align-items:center;justify-content:flex-end}.search{font-size:37px;color:#299cf4;line-height:1}.home-title{font-size:42px;letter-spacing:-1.8px;margin:27px 0 42px;font-weight:800}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.section-head h2{font-size:28px;margin:0;font-weight:750}.actions{display:flex;gap:9px}.pill,.iconbox,.dots{background:#eaf5ff;color:#299cf4;border-radius:14px;height:50px;display:flex;align-items:center;justify-content:center;font-weight:750}.pill{padding:0 17px;font-size:20px}.iconbox,.dots{width:54px;font-size:25px}.quick{width:100%;height:76px;border-radius:17px;border:0;background:#299cf4;color:#fff;font-size:21px;font-weight:750;margin-bottom:54px}.subhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.subhead h3{font-size:21px;margin:0}.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px 28px;margin-bottom:54px}.template{min-height:215px;border:1px solid #e5e6e8;border-radius:28px;padding:26px 22px 20px;background:#fff;position:relative;overflow:hidden}.template .dots{position:absolute;right:17px;top:18px;width:51px;height:51px}.template h4{font-size:24px;line-height:1.13;margin:8px 48px 13px 0;font-weight:750}.template p{font-size:18px;line-height:1.3;color:#687078;margin:0 0 17px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.ago{font-size:17px;color:#666d73;font-style:italic;display:flex;gap:8px;align-items:center}.clock{font-style:normal;font-size:20px}.example{margin-bottom:25px}.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;height:94px;padding:8px max(12px,calc((100vw - 600px)/2 + 12px)) calc(8px + env(safe-area-inset-bottom));background:#263139;color:#9fa4a8;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -8px 24px #0002}.bottom button{background:none;border:0;color:#9fa4a8;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}.bottom button.active{color:#fff}.bottom .ico{font-size:34px;line-height:34px}.bottom .plus{font-size:48px;line-height:31px}.workout-screen{min-height:100vh;background:#fff}.workout-screen .app{padding-top:calc(8px + env(safe-area-inset-top))}.workout-top{display:grid;grid-template-columns:64px 1fr 105px;align-items:center;padding:8px 0 22px}.backbtn{width:58px;height:58px;border:0;border-radius:16px;background:#eceef0;color:#30343a;font-size:28px}.drag{width:44px;height:6px;border-radius:9px;background:#d0d2d4;justify-self:center}.finishbtn{height:58px;border:0;border-radius:16px;background:#20c86b;color:#fff;font-size:18px;font-weight:800}.workout-title{display:flex;align-items:center;gap:10px;margin:15px 0 20px}.workout-title h1{font-size:39px;letter-spacing:-1.5px;margin:0;font-weight:800}.more{width:58px;height:48px;border:0;border-radius:15px;background:#eaf5ff;color:#299cf4;font-size:25px}.meta{display:grid;gap:15px;margin-bottom:70px}.meta-row{display:flex;align-items:center;gap:15px;color:#666c73;font-size:21px}.meta-icon{font-size:27px;width:38px;text-align:center}.add-main{width:100%;height:74px;border:0;border-radius:17px;background:#eaf5ff;color:#299cf4;font-size:21px;font-weight:750;margin-bottom:18px}.cancel{width:100%;height:74px;border:0;border-radius:17px;background:#fff0f1;color:#ff5964;font-size:21px;font-weight:750}.empty{text-align:center}.exercise-card{border-top:1px solid #e8e8ea;padding:22px 0 8px}.exercise-card h2{font-size:25px;margin:0 0 16px}.set-row{display:grid;grid-template-columns:36px 1fr 1fr 54px;gap:8px;align-items:center;margin:8px 0}.setno{color:#8a8f96;text-align:center}.field{width:100%;background:#f4f5f6;border:1px solid #e0e2e5;border-radius:11px;padding:12px;color:#111;text-align:center;font-size:17px}.check{width:48px;height:44px;border:0;border-radius:12px;background:#eceef0;color:#8b9096;font-size:20px}.check.done{background:#20c86b;color:#fff}.addset{background:none;border:0;color:#299cf4;font-weight:700;padding:9px 0}.overlay{position:fixed;inset:0;background:#0008;z-index:30;display:grid;place-items:end}.sheet{width:min(600px,100%);background:#fff;border-radius:25px 25px 0 0;padding:20px 16px calc(25px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}.sheet h2{margin:3px 0 14px;font-size:25px}.searchinput{width:100%;background:#f2f3f5;border:0;border-radius:13px;padding:14px;margin-bottom:10px;outline:none;font-size:17px}.option{width:100%;text-align:left;background:#f4f5f6;padding:15px;border:0;border-radius:13px;margin:5px 0;color:#111}.option small{display:block;color:#777;margin-top:3px}.toast{position:fixed;z-index:50;bottom:110px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:13px;font-weight:700}
</style></head><body><div id="app"></div><script>
const exercises=[["Panca piana bilanciere","Petto"],["Panca inclinata bilanciere","Petto"],["Panca inclinata manubri","Petto"],["Chest press","Petto"],["Pec deck","Petto"],["Croci ai cavi","Petto"],["Dip","Petto"],["Trazioni","Dorso"],["Lat machine","Dorso"],["Rematore bilanciere","Dorso"],["Pulley basso","Dorso"],["Military press","Spalle"],["Alzate laterali manubri","Spalle"],["Curl bilanciere","Bicipiti"],["Hammer curl","Bicipiti"],["Pushdown corda","Tricipiti"],["French press","Tricipiti"],["Squat","Gambe"],["Leg press","Gambe"],["Hack squat","Gambe"],["Stacco rumeno","Femorali"],["Hip thrust","Glutei"],["Calf raise in piedi","Polpacci"],["Crunch ai cavi","Addome"]];
const templates=[{name:"Spalle Petto Bicipiti",desc:"Overhead Press (Smith Machine), Lateral Raise (Dumbbell), Bench Press...",ago:"13 giorni fa"},{name:"Dorso Tricipiti Gambe",desc:"Lat Pulldown (Cable), Bent Over Row (Barbell), Leg Extension...",ago:"10 giorni fa"},{name:"Petto Spalle Bicipiti",desc:"Bench Press (Barbell), Incline Bench Press (Dumbbell), Lateral Raise...",ago:"8 giorni fa"},{name:"Gambe Dorso Tricipiti",desc:"Squat (Smith Machine), Leg Extension (Machine)...",ago:"15 giorni fa"}];
let state={screen:"home",workout:null,rest:0,restInterval:null};let history=JSON.parse(localStorage.getItem("forge_history")||"[]");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function save(){localStorage.setItem("forge_history",JSON.stringify(history))}function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function render(){document.getElementById("app").innerHTML=state.screen==="home"?home():state.screen==="workout"?workout():placeholder(state.screen);if(state.screen==="home")bottom("start")}
function home(){return `<div class="app"><div class="home-top"><div class="search">⌕</div></div><h1 class="home-title">Inizia allenamento</h1><div class="section-head"><h2>Avvio rapido</h2></div><button class="quick" onclick="startWorkout('Nuovo allenamento')">Inizia un allenamento vuoto</button><div class="section-head"><h2>Modelli</h2><div class="actions"><button class="pill" onclick="toast('Creazione template in arrivo')">＋ Template</button><button class="iconbox">▣</button><button class="dots">•••</button></div></div><div class="subhead"><h3>My Templates (${templates.length})</h3><button class="dots">•••</button></div><div class="template-grid">${templates.map((t,i)=>`<div class="template"><button class="dots" onclick="toast('Opzioni modello in arrivo')">•••</button><h4>${esc(t.name)}</h4><p>${esc(t.desc)}</p><div class="ago"><span class="clock">◷</span>${t.ago}</div></div>`).join('')}</div><div class="subhead example"><h3>Example Templates (5)</h3><button class="dots">•••</button></div></div>`}
function bottom(active){document.body.insertAdjacentHTML('beforeend',`<div class="bottom"><button onclick="placeholder('profile')"><span class="ico">●</span>Profilo</button><button onclick="placeholder('history')"><span class="ico">◷</span>Storico</button><button class="active" onclick="startWorkout('Nuovo allenamento')"><span class="plus">＋</span>Inizia allenamento</button><button onclick="placeholder('exercises')"><span class="ico">▥</span>Esercizi</button><button onclick="placeholder('measure')"><span class="ico">⌁</span>Misura</button></div>`)}
function startWorkout(name){state.workout={name,started:Date.now(),exercises:[]};state.screen="workout";render()}
function workout(){let w=state.workout;return `<div class="workout-screen"><div class="app"><div class="workout-top"><button class="backbtn" onclick="cancelWorkout()">↶</button><div class="drag"></div><button class="finishbtn" onclick="finishWorkout()">Termina</button></div><div class="workout-title"><h1>${esc(w.name)}</h1><button class="more" onclick="toast('Opzioni allenamento in arrivo')">•••</button></div><div class="meta"><div class="meta-row"><span class="meta-icon">▣</span><span>${new Date().toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</span></div><div class="meta-row"><span class="meta-icon">◷</span><span id="elapsed">${fmt(Math.floor((Date.now()-w.started)/1000))}</span></div></div>${w.exercises.map((e,i)=>card(e,i)).join('')}<button class="add-main" onclick="openLibrary()">Aggiungi esercizi</button><button class="cancel" onclick="cancelWorkout()">Annulla allenamento</button></div></div>`}
function card(e,ei){return `<div class="exercise-card"><h2>${esc(e.name)}</h2><div class="set-row" style="font-size:12px;color:#8a8f96"><span></span><span style="text-align:center">KG</span><span style="text-align:center">RIP</span><span></span></div>${e.sets.map((s,si)=>`<div class="set-row"><span class="setno">${si+1}</span><input class="field" type="number" step="0.5" value="${s.kg}" onchange="upd(${ei},${si},'kg',this.value)"><input class="field" type="number" value="${s.reps}" onchange="upd(${ei},${si},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':'○'}</button></div>`).join('')}<button class="addset" onclick="addSet(${ei})">＋ Aggiungi serie</button></div>`}
function upd(ei,si,k,v){state.workout.exercises[ei].sets[si][k]=v}function addSet(ei){let s=state.workout.exercises[ei].sets.at(-1);state.workout.exercises[ei].sets.push({kg:s?.kg||0,reps:s?.reps||8,done:false});render()}function toggleSet(ei,si){state.workout.exercises[ei].sets[si].done=!state.workout.exercises[ei].sets[si].done;if(state.workout.exercises[ei].sets[si].done)startRest(90);render()}function startRest(sec){clearInterval(state.restInterval);state.rest=sec;state.restInterval=setInterval(()=>{state.rest--;if(state.rest<=0){clearInterval(state.restInterval);state.rest=0;toast('Recupero terminato 🔥')}},1000)}
function finishWorkout(){let sets=state.workout.exercises.flatMap(e=>e.sets.filter(s=>s.done));if(!sets.length){toast('Aggiungi e completa almeno una serie');return}history.push({...state.workout,sets,date:new Date().toISOString()});save();state.workout=null;state.screen='home';render();toast('Allenamento salvato ✓')}function cancelWorkout(){clearInterval(state.restInterval);state.workout=null;state.screen='home';render()}function openLibrary(){document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="lib"><div class="sheet"><div class="section-head"><h2>Aggiungi esercizio</h2><button class="more" onclick="closeLib()">×</button></div><input class="searchinput" placeholder="Cerca esercizio..." oninput="filterLib(this.value)" id="libsearch"><div id="liblist">${libraryItems(exercises)}</div></div></div>`)}function libraryItems(arr){return arr.map(e=>`<button class="option" onclick="pickExercise(${exercises.indexOf(e)})"><strong>${esc(e[0])}</strong><small>${e[1]}</small></button>`).join('')}function filterLib(q){document.getElementById('liblist').innerHTML=libraryItems(exercises.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(q.toLowerCase())))}function pickExercise(i){state.workout.exercises.push({name:exercises[i][0],sets:[{kg:0,reps:8,done:false},{kg:0,reps:8,done:false},{kg:0,reps:8,done:false}]});closeLib();render()}function closeLib(){document.getElementById('lib')?.remove()}function placeholder(s){toast(s==='profile'?'Profilo in arrivo':s==='history'?'Storico in arrivo':s==='exercises'?'Libreria esercizi in arrivo':'Misure in arrivo')}function toast(t){let x=document.querySelector('.toast');if(x)x.remove();x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}render();setInterval(()=>{if(state.screen==='workout'&&state.workout){let e=document.getElementById('elapsed');if(e)e.textContent=fmt(Math.floor((Date.now()-state.workout.started)/1000))}},1000);
</script></body></html>
