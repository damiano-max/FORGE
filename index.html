let state={screen:'home',workout:null,modal:null,filter:'',timer:0};let history=JSON.parse(localStorage.getItem('forge_history')||'[]');let tick=null;let selectedHistoryIndex=null;
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1300)}function fmtTime(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function render(){let content=state.screen==='home'?home():state.screen==='workout'?workout():state.screen==='library'?library():state.screen==='history'?historyPage():state.screen==='detail'?historyDetail():state.screen==='measure'?measure():profile();$('app').innerHTML=content+(!['workout','detail'].includes(state.screen)?nav(): '');renderModal();if(state.screen==='workout')startElapsed()}
function nav(){return `<div class="bottom"><button onclick="go('profile')"><b>●</b>Profilo</button><button onclick="go('history')"><b>◷</b>Storico</button><button class="active" onclick="go('home')"><b>＋</b>Inizia allenamento</button><button onclick="go('library')"><b>▦</b>Esercizi</button><button onclick="go('measure')"><b>⌁</b>Misura</button></div>`}
function home(){const completed=history.length;const last=history[history.length-1];return `<div class="app homeApp"><div class="brandline"><div class="forgeMark">F<span>/</span></div><div><div class="brandName">FORGE</div><div class="brandSub">TRAINING SYSTEM</div></div><div class="liveDot"></div></div><section class="homeHero"><div class="heroGrid"></div><div class="heroKicker"><span class="cyanDot"></span> YOUR NEXT LEVEL STARTS HERE</div><h1 class="heroTitle">BUILD<br><span>YOUR</span> STRENGTH.</h1><div class="heroBottom"><p>Ogni serie conta.<br>Costruisci la tua costanza.</p><div class="heroStamp">01<br><small>FOCUS</small></div></div></section><div class="homeStats"><div class="homeStat"><span>SESSIONI</span><strong>${completed.toString().padStart(2,'0')}</strong><small>allenamenti salvati</small></div><div class="homeStat"><span>ULTIMO WORKOUT</span><strong class="statLast">${last?esc(last.name||'Workout'):'—'}</strong><small>${last?new Date(last.date).toLocaleDateString('it-IT'):'Pronto a iniziare'}</small></div></div><div class="sectionHead"><div><div class="sectionEyebrow">QUICK START</div><h2>Si comincia.</h2></div><span class="sectionIndex">01 / 03</span></div><button class="quick forgeQuick" onclick="startWorkout()"><span class="quickIcon">↗</span><span><strong>Allenamento libero</strong><small>Parti da zero, scegli gli esercizi</small></span><span class="quickArrow">↗</span></button><div class="sectionHead templateSection"><div><div class="sectionEyebrow">YOUR PLAYBOOK</div><h2>I tuoi template<span class="cyan">.</span></h2></div><button class="addTemplate" onclick="newTemplate()">＋ NUOVO</button></div><div class="templatesGrid">${templates.map((t,i)=>`<button class="tpl forgeTpl" onclick="startTemplate(${i})"><span class="tplNo">0${i+1}</span><span class="tplArrow">↗</span><h3>${esc(t[0])}</h3><p>${t[1].map(esc).join(' · ')}</p><span class="tplFooter"><span>AVVIA SESSIONE</span><span>→</span></span></button>`).join('')}</div><div class="homeFooter"><span>DISCIPLINE OVER MOTIVATION</span><span>FG / 001</span></div></div>`}
function startWorkout(){state.workout={name:'Allenamento',started:Date.now(),exercises:[]};state.screen='workout';state.timer=0;render()}function startTemplate(i){state.workout={name:templates[i][0],started:Date.now(),exercises:templates[i][1].map(n=>({name:n,sets:[{kg:0,reps:8,prev:'—',done:false}]}))};state.screen='workout';render()}
function workout(){let w=state.workout;return `<div class="app"><div class="top"><button class="back" onclick="cancelWorkout()">↶</button><div></div><button class="finish" onclick="finishWorkout()">Termina</button></div><div class="wtitle"><h1>${esc(w.name)}</h1><button class="moreBtn" onclick="openWorkoutMenu()">•••</button></div><div class="meta">▣ ${new Date().toLocaleDateString('it-IT')}<br>◷ <span id="elapsed">00:00</span></div>${w.exercises.length?w.exercises.map((e,ei)=>card(e,ei)).join(''):`<div class="empty">Nessun esercizio.<br>Aggiungi il primo esercizio per iniziare.</div>`}<button class="primary" onclick="openLibrary()">Aggiungi esercizi</button><button class="cancel" onclick="cancelWorkout()">Annulla allenamento</button></div>`}
function card(e,ei){return `<div class="ex"><div class="exHeader"><h2>${esc(e.name)}</h2><div class="exActions"><button class="iconBtn" onclick="exerciseMenu(${ei})">•••</button></div></div><div class="cols"><span>Serie</span><span>Precedente</span><span>kg</span><span>Rip.</span><span>✓</span></div>${e.sets.map((s,si)=>`<div class="set" data-e="${ei}" data-s="${si}"><span class="setno">${si+1}</span><span class="prev">${esc(s.prev||'—')}</span><input class="field" inputmode="decimal" type="number" step="0.5" value="${s.kg}" onchange="upd(${ei},${si},'kg',this.value)"><input class="field" inputmode="numeric" type="number" value="${s.reps}" onchange="upd(${ei},${si},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">✓</button></div>`).join('')}<button class="addset" onclick="addSet(${ei})"><span class="addsetPlus">＋</span><span class="addsetLabel">Aggiungi serie</span><span class="addsetTimer">${timerLabel()}</span><span class="addsetProgress"><span style="width:${Math.max(0,Math.min(100,(state.timer>0?state.timer:120)/120*100))}%"></span></span></button></div>`}
function timerLabel(){return state.timer?fmtTime(state.timer):'2:00'}function upd(ei,si,k,v){state.workout.exercises[ei].sets[si][k]=v}function addSet(ei){let a=state.workout.exercises[ei].sets,s=a[a.length-1]||{};a.push({kg:s.kg||0,reps:s.reps||8,prev:(s.kg||s.reps)?s.kg+' kg × '+s.reps:'—',done:false});render()}
function toggleSet(ei,si){state.workout.exercises[ei].sets[si].done=!state.workout.exercises[ei].sets[si].done;if(state.workout.exercises[ei].sets[si].done){state.timer=120;startRest()}render()}
function restHUD(){return `<div class="recoveryInline"><div class="recoveryInlineLeft"><span class="recoveryPulse"></span><div><small>RECUPERO</small><strong>${fmtTime(state.timer)}</strong></div></div><div class="recoveryInlineTrack"><span style="width:${Math.max(0,Math.min(100,state.timer/120*100))}%"></span></div><div class="recoveryInlineActions"><button onclick="adjustRest(-15)">−15</button><button onclick="adjustRest(15)">+15</button><button class="recoveryInlineSkip" onclick="stopRest()">SALTA</button></div></div>`}function adjustRest(delta){state.timer=Math.max(0,Math.min(600,state.timer+delta));if(state.timer===0){clearInterval(tick);tick=null}else if(!tick)startRest();render()}function stopRest(){clearInterval(tick);tick=null;state.timer=0;render()}function startRest(){clearInterval(tick);tick=setInterval(()=>{if(state.timer>0){state.timer--;if(state.screen==='workout')render()}else clearInterval(tick)},1000)}function startElapsed(){let el=$('elapsed');if(!el)return;let started=state.workout.started;setInterval(()=>{if(state.screen==='workout'&&$('elapsed'))$('elapsed').textContent=fmtTime(Math.floor((Date.now()-started)/1000))},1000)}
function openLibrary(){state.screen='library';state.filter='';render()}function library(){let a=exercises.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(state.filter.toLowerCase()));return `<div class="app"><div class="top"><button class="back" onclick="state.screen='workout';render()">×</button><h2 style="margin:0;font-size:20px">Aggiungi esercizio</h2><div></div></div><input class="search" placeholder="⌕  Ricerca" value="${esc(state.filter)}" oninput="state.filter=this.value;render()"><div class="list">${a.map((e,i)=>`<button class="item" onclick="pick('${e[0].replace(/'/g,"\\'")}')"><span class="ico">${e[2]}</span><span><strong>${esc(e[0])}</strong><small>${esc(e[1])}</small></span><span style="margin-left:auto;color:#299cf4">?</span></button>`).join('')}</div></div>`}
function pick(name){let e=exercises.find(x=>x[0]===name);state.workout.exercises.push({name:e?e[0]:name,sets:[{kg:0,reps:8,prev:'—',done:false}]});state.screen='workout';render()}
function exerciseMenu(ei){state.modal={type:'exercise',ei};renderModal()}function openWorkoutMenu(){state.modal={type:'workout'};renderModal()}
function renderModal(){let m=state.modal;if(!m){$('modal').innerHTML='';return}let html='';if(m.type==='exercise'){html=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grab"></div><h3>${esc(state.workout.exercises[m.ei].name)}</h3><div class="menu"><button onclick="closeModal();toast('Nota esercizio pronta')">▣  Aggiungi nota</button><button onclick="closeModal();toast('Nota adesiva pronta')">▣  Aggiungi nota adesiva</button><button onclick="closeModal();startRest();state.timer=120;render()">◷  Aggiornamento dei timer di riscaldamento</button><button onclick="replaceExercise(${m.ei})">↻  Sostituisci esercizio</button><button onclick="closeModal();toast('Superset creato')">⛓  Creare un superset</button><button onclick="closeModal();toast('Preferenze aperte')">⚙  Preferenze</button><button class="danger" onclick="removeExercise(${m.ei})">×  Rimuovi esercizio</button></div></div></div>`}else if(m.type==='workout'){html=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grab"></div><h3>Allenamento</h3><div class="menu"><button onclick="closeModal();toast('Nota aggiunta')">▣  Aggiungi nota</button><button onclick="closeModal();toast('Nota adesiva aggiunta')">▣  Aggiungi nota adesiva</button><button onclick="closeModal();startRest();state.timer=120;render()">◷  Timer di recupero</button><button onclick="closeModal();openLibrary()">＋  Aggiungi esercizio</button><button onclick="closeModal();toast('Preferenze')">⚙  Preferenze</button><button class="danger" onclick="cancelWorkout()">×  Annulla allenamento</button></div></div></div>`}else if(m.type==='categories'){html=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grab"></div><h3>Seleziona categoria</h3><div class="catGrid">${['Qualsiasi categoria','Core','Arms','Back','Chest','Legs','Shoulders','Other','Olympic','Full Body','Cardio'].map(c=>`<button class="cat" onclick="filterCat('${c}')">${c}</button>`).join('')}</div></div></div>`}$('modal').innerHTML=html}
function replaceExercise(ei){state.modal={type:'replace',ei};$('modal').innerHTML=`<div class="overlay"><div class="sheet"><div class="grab"></div><h3>Sostituisci esercizio</h3><input class="search" placeholder="Ricerca" oninput="replaceList(this.value,${ei})"><div id="replaceList" class="list">${replaceItems('',ei)}</div></div></div>`}function replaceItems(q,ei){return exercises.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(q.toLowerCase())).map(e=>`<button class="item" onclick="doReplace(${ei},'${e[0].replace(/'/g,"\\'")}')"><span class="ico">${e[2]}</span><span><strong>${esc(e[0])}</strong><small>${esc(e[1])}</small></span></button>`).join('')}function replaceList(q,ei){$('replaceList').innerHTML=replaceItems(q,ei)}function doReplace(ei,name){state.workout.exercises[ei].name=name;closeModal();render()}function removeExercise(ei){state.workout.exercises.splice(ei,1);closeModal();render();toast('Esercizio rimosso')}function filterCat(c){closeModal();state.filter=c==='Qualsiasi categoria'?'':c;openLibrary()}
function closeModal(){state.modal=null;renderModal()}function cancelWorkout(){clearInterval(tick);state.workout=null;state.timer=0;state.screen='home';closeModal();render()}function finishWorkout(){let sets=state.workout.exercises.flatMap(e=>e.sets.filter(s=>s.done));if(!sets.length){toast('Completa almeno una serie');return}history.push({name:state.workout.name,date:new Date().toISOString(),exercises:state.workout.exercises,sets:sets.length});localStorage.setItem('forge_history',JSON.stringify(history));toast('Allenamento salvato');setTimeout(()=>{state.workout=null;state.screen='history';render()},500)}
function go(s){state.screen=s;render()}function historyPage(){return `<div class="app"><h1 class="title" style="margin-bottom:20px">Storico</h1>${history.length?history.slice().reverse().map((h,ri)=>`<button class="historyCard" style="display:block;width:100%;text-align:left;background:#fff;color:inherit;font-family:inherit" onclick="openHistoryDetail(${history.length-1-ri})"><h3>${esc(h.name||'Allenamento')}</h3><div class="stat"><span>${new Date(h.date).toLocaleDateString('it-IT')}</span><span>${Number(h.sets)||0} serie completate　›</span></div></button>`).join(''):'<div class="empty">I tuoi allenamenti completati appariranno qui.</div>'}</div>`}
function openHistoryDetail(index){selectedHistoryIndex=index;state.screen='detail';render()}
function historyDetail(){const h=history[selectedHistoryIndex];if(!h)return `<div class="app"><button class="back" onclick="go('history')">←</button><div class="empty">Allenamento non trovato.</div></div>`;const exercisesSaved=Array.isArray(h.exercises)?h.exercises:[];const completedSets=exercisesSaved.reduce((n,e)=>n+(Array.isArray(e.sets)?e.sets.filter(s=>s.done).length:0),0);const volume=exercisesSaved.reduce((total,e)=>total+(Array.isArray(e.sets)?e.sets.reduce((v,s)=>v+(Number(s.kg)||0)*(Number(s.reps)||0)*(s.done?1:0),0):0),0);return `<div class="app"><div class="detailHead"><button class="back" onclick="go('history')">←</button><div><div class="muted" style="font-size:12px">Dettaglio allenamento</div><h1>${esc(h.name||'Allenamento')}</h1></div></div><div class="meta">▣ ${new Date(h.date).toLocaleDateString('it-IT')} · ${new Date(h.date).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</div><div class="detailSummary"><div><small>Serie completate</small><strong>${Number(h.sets)||completedSets}</strong></div><div><small>Volume registrato</small><strong>${Math.round(volume).toLocaleString('it-IT')} kg</strong></div></div>${exercisesSaved.length?exercisesSaved.map(e=>{const sets=Array.isArray(e.sets)?e.sets:[];return `<div class="detailExercise"><h3>${esc(e.name||'Esercizio')}</h3><div class="detailSetHead"><span>Serie</span><span>Kg</span><span>Rip.</span><span>Stato</span></div>${sets.length?sets.map((s,i)=>`<div class="detailSet"><span class="detailNo">${i+1}</span><span>${s.kg!==undefined&&s.kg!==''?esc(s.kg):'—'}</span><span>${s.reps!==undefined&&s.reps!==''?esc(s.reps):'—'}</span><span class="setStatus ${s.done?'':'pending'}">${s.done?'✓ Completata':'Non completata'}</span></div>`).join(''):'<div class="muted" style="font-size:13px">Nessuna serie registrata.</div>'}</div>`}).join(''):'<div class="empty">Questo allenamento è stato salvato da una versione precedente che non conservava il dettaglio delle serie. Gli allenamenti nuovi registreranno tutti i dettagli.</div>'}<button class="primary" onclick="go('history')">Torna allo storico</button></div>`}function measure(){return `<div class="app"><h1 class="title" style="margin-bottom:20px">Misura</h1><div class="measureCard"><div class="stat"><b>Peso</b><span>— kg</span></div></div><div class="measureCard"><div class="stat"><b>Progressi</b><span>Ancora nessun dato</span></div></div></div>`}function profile(){return `<div class="app"><h1 class="title" style="margin-bottom:20px">Profilo</h1><div class="measureCard"><h3 style="margin-top:0">FORGE</h3><p class="muted">Il tuo spazio per allenarti, registrare e migliorare.</p></div></div>`}function newTemplate(){toast('Creazione template pronta per il prossimo step')}
let touch=null;document.addEventListener('touchstart',e=>{let row=e.target.closest('.set');if(!row||e.target.closest('input,button'))return;touch={row,x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});document.addEventListener('touchmove',e=>{if(!touch)return;let dx=e.touches[0].clientX-touch.x,dy=e.touches[0].clientY-touch.y;if(dx<0&&Math.abs(dx)>Math.abs(dy)*1.05)touch.row.classList.add('swiping');else touch.row.classList.remove('swiping')},{passive:true});document.addEventListener('touchend',e=>{if(!touch)return;let t=touch;touch=null;let dx=e.changedTouches[0].clientX-t.x,dy=e.changedTouches[0].clientY-t.y;t.row.classList.remove('swiping');if(dx<-55&&Math.abs(dx)>Math.abs(dy)*1.15){let ei=+t.row.dataset.e,si=+t.row.dataset.s;if(state.workout&&state.workout.exercises[ei]){state.workout.exercises[ei].sets.splice(si,1);render();toast('Serie eliminata')}}},{passive:true});
render();
</script></body></html>
