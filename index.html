<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><link rel="manifest" href="manifest.webmanifest"><title>FORGE — Gym Tracker</title><style>:root{--bg:#08090c;--card:#12141a;--card2:#181b23;--text:#f5f7fb;--muted:#8e95a3;--accent:#b8ff3d;--line:#272b35}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#20261a 0,#0b0c10 32%,#08090c 70%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:20px 2px 18px}.logo{font-size:25px;font-weight:900;letter-spacing:3px}.avatar{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#15171d}h1{font-size:31px;line-height:1.05;margin:8px 0 7px}.sub{color:var(--muted);font-size:15px;margin-bottom:20px}.hero{background:linear-gradient(145deg,#171c12,#10130e);border:1px solid #303826;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 16px 40px #0005}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--accent);font-weight:800}.hero h2{margin:8px 0 5px;font-size:22px}.hero p{margin:0 0 18px;color:#aeb4bd}.primary{width:100%;padding:16px;border-radius:15px;background:var(--accent);color:#0a0d07;font-weight:900;font-size:16px}.secondary{padding:12px 15px;border-radius:13px;background:var(--card2);font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 22px}.stat,.template,.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:15px}.stat b{display:block;font-size:21px}.stat span{color:var(--muted);font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 10px}.section-title h3{margin:0;font-size:17px}.muted{color:var(--muted)}.templates{display:grid;gap:10px}.template{padding:16px;display:flex;align-items:center;justify-content:space-between}.template strong{display:block}.template small{color:var(--muted)}nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0a0b0ed9;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around}nav button{background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center}nav button.active{color:var(--accent)}nav i{font-style:normal;font-size:20px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0}.back{background:none;color:var(--muted);font-size:15px}.timer{font-variant-numeric:tabular-nums;font-weight:800}.workout-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:15px}.exercise{padding:15px;margin-bottom:12px}.exercise-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.exercise-head h3{margin:0;font-size:17px}.exercise-head small{color:var(--muted)}.set-row{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:7px;align-items:center;margin:7px 0}.set-no{color:var(--muted);font-size:12px;text-align:center}.field{width:100%;background:#0c0e13;border:1px solid var(--line);border-radius:10px;padding:10px;color:white;text-align:center;outline:none}.check{width:40px;height:40px;border-radius:11px;background:#222630;color:var(--muted);font-size:18px}.check.done{background:var(--accent);color:#080a06}.addset{margin-top:7px;background:none;color:var(--accent);font-size:13px;font-weight:800}.finish{margin-top:8px;margin-bottom:25px}.overlay{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:end}.sheet{width:min(520px,100%);background:#111319;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(25px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}.sheet h2{margin:3px 0 14px}.search{width:100%;background:#090a0e;border:1px solid var(--line);border-radius:12px;padding:12px;color:white;margin-bottom:10px}.exercise-option{width:100%;text-align:left;background:#181b22;padding:14px;border-radius:12px;margin:5px 0}.exercise-option small{display:block;color:var(--muted);margin-top:3px}.toast{position:fixed;z-index:30;bottom:95px;left:50%;transform:translateX(-50%);background:#f4f5f7;color:#0a0b0d;padding:11px 15px;border-radius:13px;font-weight:750;box-shadow:0 10px 30px #0008}.progress-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:10px 0}.big{font-size:32px;font-weight:900}.bar{height:9px;background:#242833;border-radius:99px;overflow:hidden;margin-top:12px}.bar div{height:100%;background:var(--accent);width:72%}</style></head><body><div id="app"></div><script>const exercises=[["Panca piana bilanciere","Petto"],["Panca inclinata bilanciere","Petto"],["Panca inclinata manubri","Petto"],["Chest press","Petto"],["Pec deck","Petto"],["Croci ai cavi","Petto"],["Dip","Petto"],["Trazioni","Dorso"],["Lat machine","Dorso"],["Rematore bilanciere","Dorso"],["Pulley basso","Dorso"],["Military press","Spalle"],["Alzate laterali manubri","Spalle"],["Curl bilanciere","Bicipiti"],["Hammer curl","Bicipiti"],["Pushdown corda","Tricipiti"],["French press","Tricipiti"],["Squat","Gambe"],["Leg press","Gambe"],["Hack squat","Gambe"],["Stacco rumeno","Femorali"],["Hip thrust","Glutei"],["Calf raise in piedi","Polpacci"],["Crunch ai cavi","Addome"]];let state={screen:"home",workout:null,rest:0,restInterval:null};let history=JSON.parse(localStorage.getItem("forge_history")||"[]");function save(){localStorage.setItem("forge_history",JSON.stringify(history))}function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function volume(){return history.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+(+s.kg||0)*(+s.reps||0),0),0)}function render(){let a=document.getElementById("app");a.innerHTML=state.screen==="home"?home():state.screen==="workout"?workout():state.screen==="progress"?progress():profile();if(state.screen!=="workout")nav()}function nav(){document.getElementById("app").insertAdjacentHTML("beforeend",`<nav><button class="${state.screen==="home"?"active":""}" onclick="go('home')"><i>⌂</i>Home</button><button class="${state.screen==="progress"?"active":""}" onclick="go('progress')"><i>↗</i>Progressi</button><button class="${state.screen==="profile"?"active":""}" onclick="go('profile')"><i>⚙</i>Profilo</button></nav>`)}function header(){return`<header><div class="logo">FORGE</div><div class="avatar">D</div></header>`}function home(){return`<div class="app">${header()}<h1>Pronto a spingere?</h1><div class="sub">Il tuo prossimo allenamento, senza perdere tempo.</div><div class="hero"><div class="eyebrow">Prossimo allenamento</div><h2>Push A</h2><p>Petto · Spalle · Tricipiti</p><button class="primary" onclick="startWorkout()">▶ Inizia allenamento</button></div><div class="stats"><div class="stat"><b>${history.length}</b><span>Workout</span></div><div class="stat"><b>${volume()}</b><span>kg volume</span></div><div class="stat"><b>0</b><span>PR</span></div></div><div class="section-title"><h3>I tuoi template</h3><button class="secondary" onclick="toast('Creazione template in arrivo')">＋</button></div><div class="templates">${["Push A","Pull A","Legs A","Upper B"].map(x=>`<div class="template"><div><strong>${x}</strong><small>Template allenamento</small></div><button class="secondary" onclick="startWorkout('${x}')">▶</button></div>`).join("")}</div></div>`}function startWorkout(name="Push A"){state.workout={name,started:Date.now(),exercises:[{name:"Panca piana bilanciere",sets:[{kg:80,reps:8,done:false},{kg:80,reps:8,done:false},{kg:80,reps:7,done:false}]},{name:"Panca inclinata manubri",sets:[{kg:28,reps:10,done:false},{kg:28,reps:10,done:false},{kg:28,reps:9,done:false}]},{name:"Alzate laterali manubri",sets:[{kg:10,reps:12,done:false},{kg:10,reps:12,done:false}]}]};state.screen="workout";render()}function workout(){let w=state.workout;return`<div class="app"><div class="topbar"><button class="back" onclick="confirmExit()">‹ Home</button><div class="timer" id="elapsed">00:00</div><button class="back" onclick="finishWorkout()">Fine</button></div><h1>${esc(w.name)}</h1><div class="workout-meta"><span>${w.exercises.length} esercizi</span><span>Timer attivo</span></div>${w.exercises.map((e,ei)=>card(e,ei)).join("")}<button class="secondary" style="width:100%;margin-bottom:10px" onclick="openLibrary()">＋ Aggiungi esercizio</button><button class="primary finish" onclick="finishWorkout()">Completa allenamento</button></div>${state.rest>0?`<div class="toast">Recupero ${fmt(state.rest)}</div>`:""}`}function card(e,ei){return`<div class="exercise"><div class="exercise-head"><div><h3>${esc(e.name)}</h3><small>Ultima: ${e.sets[0]?.kg||"-"} kg × ${e.sets[0]?.reps||"-"}</small></div><button class="back" onclick="removeExercise(${ei})">×</button></div><div class="set-row" style="color:var(--muted);font-size:11px"><span></span><span style="text-align:center">KG</span><span style="text-align:center">REPS</span><span></span></div>${e.sets.map((s,si)=>`<div class="set-row"><span class="set-no">${si+1}</span><input class="field" type="number" step="0.5" value="${s.kg}" onchange="upd(${ei},${si},'kg',this.value)"><input class="field" type="number" value="${s.reps}" onchange="upd(${ei},${si},'reps',this.value)"><button class="check ${s.done?"done":""}" onclick="toggleSet(${ei},${si})">${s.done?"✓":"○"}</button></div>`).join("")}<button class="addset" onclick="addSet(${ei})">＋ Aggiungi serie</button></div>`}function upd(ei,si,k,v){state.workout.exercises[ei].sets[si][k]=v}function addSet(ei){let s=state.workout.exercises[ei].sets.at(-1);state.workout.exercises[ei].sets.push({kg:s?.kg||0,reps:s?.reps||8,done:false});render()}function toggleSet(ei,si){state.workout.exercises[ei].sets[si].done=!state.workout.exercises[ei].sets[si].done;if(state.workout.exercises[ei].sets[si].done)startRest(90);render()}function removeExercise(ei){state.workout.exercises.splice(ei,1);render()}function finishWorkout(){if(!state.workout)return;let sets=state.workout.exercises.flatMap(e=>e.sets.filter(s=>s.done));if(!sets.length){toast("Completa almeno una serie");return}history.push({...state.workout,sets,date:new Date().toISOString()});save();state.rest=0;state.screen="home";render();toast("Allenamento salvato ✓")}function startRest(sec){clearInterval(state.restInterval);state.rest=sec;state.restInterval=setInterval(()=>{state.rest--;if(state.rest<=0){clearInterval(state.restInterval);state.rest=0;toast("Recupero terminato 🔥")}},1000)}function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function openLibrary(){document.body.insertAdjacentHTML("beforeend",`<div class="overlay" id="lib"><div class="sheet"><div class="section-title"><h2>Aggiungi esercizio</h2><button class="back" onclick="closeLib()">Chiudi</button></div><input class="search" placeholder="Cerca esercizio..." oninput="filterLib(this.value)" id="libsearch"><div id="liblist">${libraryItems(exercises)}</div></div></div>`)}function libraryItems(arr){return arr.map(e=>`<button class="exercise-option" onclick="pickExercise(${exercises.indexOf(e)})"><strong>${esc(e[0])}</strong><small>${e[1]}</small></button>`).join("")}function filterLib(q){document.getElementById("liblist").innerHTML=libraryItems(exercises.filter(e=>e[0].toLowerCase().includes(q.toLowerCase())||e[1].toLowerCase().includes(q.toLowerCase())))}function pickExercise(i){state.workout.exercises.push({name:exercises[i][0],sets:[{kg:0,reps:8,done:false},{kg:0,reps:8,done:false},{kg:0,reps:8,done:false}]});closeLib();render()}function closeLib(){document.getElementById("lib")?.remove()}function progress(){return`<div class="app">${header()}<h1>Progressi</h1><div class="sub">Trasforma ogni allenamento in progresso.</div><div class="progress-card"><div class="muted">Volume totale</div><div class="big">${volume()} kg</div><div class="bar"><div></div></div></div><div class="progress-card"><div class="muted">Allenamenti completati</div><div class="big">${history.length}</div></div><div class="section-title"><h3>Storico</h3></div>${history.length?history.slice().reverse().map(w=>`<div class="template"><div><strong>${esc(w.name)}</strong><small>${new Date(w.date).toLocaleDateString("it-IT")} · ${w.sets.length} serie</small></div><span>${w.sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0)} kg</span></div>`).join(""): `<div class="muted">Ancora nessun allenamento.</div>`}</div>`}function profile(){return`<div class="app">${header()}<h1>Profilo</h1><div class="sub">Le impostazioni di FORGE.</div><div class="progress-card"><strong>FORGE Pro</strong><p class="muted">Progressione intelligente, analisi avanzate e AI Coach.</p><button class="primary" onclick="toast('Pro arriverà nella prossima versione')">Scopri Pro</button></div><div class="progress-card"><strong>Dati locali</strong><p class="muted">Questa beta salva i workout sul dispositivo.</p></div></div>`}function confirmExit(){if(confirm("Uscire dall'allenamento?")){state.screen="home";render()}}function go(s){state.screen=s;render()}function toast(t){let x=document.querySelector(".toast");if(x)x.remove();x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}render();setInterval(()=>{if(state.screen==="workout"){let e=document.getElementById("elapsed");if(e)e.textContent=fmt(Math.floor((Date.now()-state.workout.started)/1000))}},1000);</script></body></html>
