<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>FORGE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#171a1d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:620px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));min-height:100vh}.title{font-size:42px;letter-spacing:-2px;margin:48px 0 38px;font-weight:800}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:34px 0 14px}.sectionHead h2{font-size:25px;margin:0}.muted{color:#777}.blue{color:#299cf4}.quick,.primary{width:100%;border:0;border-radius:9px;background:#299cf4;color:#fff;font-weight:750}.quick{height:48px;font-size:16px}.templatesGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tpl{position:relative;min-height:156px;border:1px solid #e1e3e6;border-radius:10px;padding:15px;background:#fff}.tpl h3{font-size:16px;line-height:1.15;margin:0 24px 9px 0}.tpl p{font-size:12px;line-height:1.35;color:#60656a;margin:0}.dots{position:absolute;right:10px;top:9px;border:0;background:none;color:#6c7278;font-size:19px}.templateTop{display:flex;align-items:center;gap:8px}.addTemplate{border:0;background:none;color:#299cf4;font-weight:700}.folder{border:0;background:none;color:#687078;font-size:18px}.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;height:92px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#20282e;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -4px 15px #0001}.bottom button{border:0;background:none;color:#8d9499;font-size:10px}.bottom .active{color:#fff}.bottom b{display:block;font-size:21px;line-height:23px;margin-bottom:2px}.top{display:grid;grid-template-columns:52px 1fr 78px;gap:8px;align-items:center;padding-top:5px}.back,.finish,.moreBtn{height:44px;border:0;border-radius:9px}.back{background:#eef0f2;font-size:25px}.finish{background:#20c86b;color:#fff;font-size:13px;font-weight:800}.moreBtn{background:#eaf5ff;color:#299cf4;font-weight:800}.wtitle{display:flex;align-items:center;gap:9px;margin:30px 0 10px}.wtitle h1{font-size:30px;letter-spacing:-1px;margin:0}.meta{color:#666;font-size:13px;line-height:1.8;margin-bottom:24px}.ex{border-top:1px solid #e3e5e7;padding:16px 0 4px}.exHeader{display:flex;align-items:center;justify-content:space-between}.exHeader h2{font-size:17px;color:#299cf4;margin:0 0 10px}.exActions{display:flex;gap:4px}.iconBtn{border:0;background:none;color:#7a8085;font-size:17px;padding:4px}.cols,.set{display:grid;grid-template-columns:37px 1.15fr .82fr .7fr 44px;gap:5px;align-items:center}.cols{font-size:10px;color:#555;font-weight:700}.cols span{text-align:center}.set{margin:7px 0;touch-action:pan-y;position:relative;transition:transform .16s ease,opacity .16s ease}.set.swiping{transform:translateX(-82px);opacity:.55}.setno{background:#eceef0;border-radius:7px;padding:10px 0;text-align:center;font-size:13px}.field{width:100%;background:#f1f2f3;border:1px solid #dfe1e4;border-radius:7px;padding:9px 3px;text-align:center;font-size:14px;outline:none}.field:focus{border-color:#299cf4;background:#fff}.prev{text-align:center;color:#555;font-size:11px}.check{width:40px;height:38px;border:0;border-radius:7px;background:#e8eaec;font-size:18px}.check.done{background:#20c86b;color:#fff}.addset{width:100%;height:37px;border:0;border-radius:7px;background:#edf0f2;color:#171a1d;font-size:12px;font-weight:700;margin:5px 0 17px}.primary{height:45px;font-size:15px}.cancel{width:100%;height:45px;border:0;border-radius:8px;background:#fff0f1;color:#f05a65;font-size:14px;font-weight:750;margin-top:10px}.search{width:100%;height:44px;border:0;border-radius:8px;background:#f0f1f3;padding:0 14px;font-size:15px;margin:10px 0}.list{border-top:1px solid #e6e7e9}.item{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #e6e7e9;padding:12px 3px;min-height:61px;display:flex;align-items:center;gap:11px}.item .ico{width:34px;height:34px;border-radius:8px;background:#f0f2f4;display:grid;place-items:center;font-size:17px}.item strong{font-size:14px}.item small{display:block;color:#697078;margin-top:3px}.overlay{position:fixed;z-index:80;inset:0;background:#0005;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(620px,100%);background:#fff;border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.grab{width:38px;height:4px;background:#bbb;border-radius:3px;margin:2px auto 14px}.sheet h3{font-size:18px;margin:8px 0 12px}.menu{background:#2a3136;color:#fff;border-radius:12px;padding:7px;margin-bottom:8px}.menu button{display:block;width:100%;border:0;background:none;color:#fff;text-align:left;padding:11px 7px;font-size:14px}.menu button.danger{color:#ff626d}.catGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{border:1px solid #e0e2e4;background:#fff;border-radius:9px;padding:12px;text-align:left;font-weight:700}.historyCard,.measureCard{border:1px solid #e2e4e6;border-radius:10px;padding:14px;margin:9px 0}.historyCard h3{margin:0 0 6px;font-size:16px}.stat{display:flex;justify-content:space-between;color:#666;font-size:13px}.empty{padding:45px 15px;text-align:center;color:#777}.timer{position:fixed;z-index:70;left:12px;right:12px;bottom:104px;background:#299cf4;color:#fff;border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 7px 25px #0003}.timer strong{font-size:18px}.timer button{border:0;background:#fff;color:#299cf4;border-radius:7px;padding:6px 10px;font-weight:700}.toast{position:fixed;z-index:100;bottom:112px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700}
</style></head>
<body><div id="app"></div><div id="modal"></div><script>
const exercises=[['Panca piana bilanciere','Petto','🏋️'],['Panca inclinata bilanciere','Petto','🏋️'],['Panca inclinata manubri','Petto','🏋️'],['Chest press','Petto','💪'],['Pec deck','Petto','💪'],['Croci ai cavi','Petto','💪'],['Dip','Petto','💪'],['Trazioni','Dorso','🏋️'],['Lat machine','Dorso','💪'],['Rematore bilanciere','Dorso','🏋️'],['Pulley basso','Dorso','💪'],['Military press','Spalle','🏋️'],['Alzate laterali manubri','Spalle','💪'],['Curl bilanciere','Bicipiti','💪'],['Hammer curl','Bicipiti','💪'],['Pushdown corda','Tricipiti','💪'],['French press','Tricipiti','💪'],['Squat','Gambe','🏋️'],['Leg press','Gambe','🦵'],['Hack squat','Gambe','🦵'],['Stacco rumeno','Femorali','🏋️'],['Hip thrust','Glutei','🦵'],['Calf raise in piedi','Polpacci','🦵'],['Crunch ai cavi','Addome','🔥']];
const templates=[['Spalle Petto Bicipiti',['Overhead Press','Lateral Raise','Bench Press','Incline Curl','Chest Press']],['Dorso Tricipiti Gambe',['Lat Pulldown','Cable Row','Triceps Pushdown','Squat']],['Petto Spalle Bicipiti',['Bench Press','Incline Bench Press','Lateral Raise','Barbell Curl']],['Gambe Dorso Tricipiti',['Squat','Lat Pulldown','Hammer Curl','Crunch']]];
let state={screen:'home',workout:null,modal:null,filter:'',timer:0};let history=JSON.parse(localStorage.getItem('forge_history')||'[]');let tick=null;
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1300)}function fmtTime(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function render(){let content=state.screen==='home'?home():state.screen==='workout'?workout():state.screen==='library'?library():state.screen==='history'?historyPage():state.screen==='measure'?measure():profile();$('app').innerHTML=content+(state.screen!=='workout'?nav(): '');renderModal();if(state.screen==='workout')startElapsed()}
function nav(){return `<div class="bottom"><button onclick="go('profile')"><b>●</b>Profilo</button><button onclick="go('history')"><b>◷</b>Storico</button><button class="active" onclick="startWorkout()"><b>＋</b>Inizia allenamento</button><button onclick="go('library')"><b>▦</b>Esercizi</button><button onclick="go('measure')"><b>⌁</b>Misura</button></div>`}
function home(){return `<div class="app"><h1 class="title">Inizia allenamento</h1><div class="sectionHead"><h2>Avvio rapido</h2></div><button class="quick" onclick="startWorkout()">Inizia un allenamento vuoto</button><div class="sectionHead"><h2>Modelli</h2><div class="templateTop"><button class="addTemplate" onclick="newTemplate()">＋ Template</button><button class="folder" onclick="toast('Cartelle in arrivo')">▱</button><button class="iconBtn">•••</button></div></div><div class="templatesGrid">${templates.map((t,i)=>`<div class="tpl" onclick="startTemplate(${i})"><button class="dots">•••</button><h3>${esc(t[0])}</h3><p>${t[1].map(esc).join('<br>')}</p></div>`).join('')}</div><div class="sectionHead"><h2>Example Templates (5)</h2><button class="iconBtn">•••</button></div><div class="templatesGrid"><div class="tpl"><h3>Total Body</h3><p>Squat<br>Bench Press<br>Lat Pulldown<br>Shoulder Press</p></div><div class="tpl"><h3>Upper Body</h3><p>Bench Press<br>Row<br>Lateral Raise<br>Curl</p></div></div></div>`}
function startWorkout(){state.workout={name:'Allenamento',started:Date.now(),exercises:[]};state.screen='workout';state.timer=0;render()}function startTemplate(i){state.workout={name:templates[i][0],started:Date.now(),exercises:templates[i][1].map(n=>({name:n,sets:[{kg:0,reps:8,prev:'—',done:false}]}))};state.screen='workout';render()}
function workout(){let w=state.workout;return `<div class="app"><div class="top"><button class="back" onclick="cancelWorkout()">↶</button><div></div><button class="finish" onclick="finishWorkout()">Termina</button></div><div class="wtitle"><h1>${esc(w.name)}</h1><button class="moreBtn" onclick="openWorkoutMenu()">•••</button></div><div class="meta">▣ ${new Date().toLocaleDateString('it-IT')}<br>◷ <span id="elapsed">00:00</span></div>${w.exercises.length?w.exercises.map((e,ei)=>card(e,ei)).join(''):`<div class="empty">Nessun esercizio.<br>Aggiungi il primo esercizio per iniziare.</div>`}<button class="primary" onclick="openLibrary()">Aggiungi esercizi</button><button class="cancel" onclick="cancelWorkout()">Annulla allenamento</button></div>`}
function card(e,ei){return `<div class="ex"><div class="exHeader"><h2>${esc(e.name)}</h2><div class="exActions"><button class="iconBtn" onclick="exerciseMenu(${ei})">•••</button></div></div><div class="cols"><span>Serie</span><span>Precedente</span><span>kg</span><span>Rip.</span><span>✓</span></div>${e.sets.map((s,si)=>`<div class="set" data-e="${ei}" data-s="${si}"><span class="setno">${si+1}</span><span class="prev">${esc(s.prev||'—')}</span><input class="field" inputmode="decimal" type="number" step="0.5" value="${s.kg}" onchange="upd(${ei},${si},'kg',this.value)"><input class="field" inputmode="numeric" type="number" value="${s.reps}" onchange="upd(${ei},${si},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">✓</button></div>`).join('')}<button class="addset" onclick="addSet(${ei})">＋ Aggiungi serie (${timerLabel()})</button></div>`}
function timerLabel(){return state.timer?fmtTime(state.timer):'2:00'}function upd(ei,si,k,v){state.workout.exercises[ei].sets[si][k]=v}function addSet(ei){let a=state.workout.exercises[ei].sets,s=a[a.length-1]||{};a.push({kg:s.kg||0,reps:s.reps||8,prev:(s.kg||s.reps)?s.kg+' kg × '+s.reps:'—',done:false});state.timer=120;startRest();render()}
function toggleSet(ei,si){state.workout.exercises[ei].sets[si].done=!state.workout.exercises[ei].sets[si].done;if(state.workout.exercises[ei].sets[si].done){state.timer=120;startRest()}render()}
function startRest(){clearInterval(tick);tick=setInterval(()=>{if(state.timer>0){state.timer--;if(state.screen==='workout')render()}else clearInterval(tick)},1000)}function startElapsed(){let el=$('elapsed');if(!el)return;let started=state.workout.started;setInterval(()=>{if(state.screen==='workout'&&$('elapsed'))$('elapsed').textContent=fmtTime(Math.floor((Date.now()-started)/1000))},1000)}
function openLibrary(){state.screen='library';state.filter='';render()}function library(){let a=exercises.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(state.filter.toLowerCase()));return `<div class="app"><div class="top"><button class="back" onclick="state.screen='workout';render()">×</button><h2 style="margin:0;font-size:20px">Aggiungi esercizio</h2><div></div></div><input class="search" placeholder="⌕  Ricerca" value="${esc(state.filter)}" oninput="state.filter=this.value;render()"><div class="list">${a.map((e,i)=>`<button class="item" onclick="pick('${e[0].replace(/'/g,"\\'")}')"><span class="ico">${e[2]}</span><span><strong>${esc(e[0])}</strong><small>${esc(e[1])}</small></span><span style="margin-left:auto;color:#299cf4">?</span></button>`).join('')}</div></div>`}
function pick(name){let e=exercises.find(x=>x[0]===name);state.workout.exercises.push({name:e?e[0]:name,sets:[{kg:0,reps:8,prev:'—',done:false}]});state.screen='workout';render()}
function exerciseMenu(ei){state.modal={type:'exercise',ei};renderModal()}function openWorkoutMenu(){state.modal={type:'workout'};renderModal()}
function renderModal(){let m=state.modal;if(!m){$('modal').innerHTML='';return}let html='';if(m.type==='exercise'){html=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grab"></div><h3>${esc(state.workout.exercises[m.ei].name)}</h3><div class="menu"><button onclick="closeModal();toast('Nota esercizio pronta')">▣  Aggiungi nota</button><button onclick="closeModal();toast('Nota adesiva pronta')">▣  Aggiungi nota adesiva</button><button onclick="closeModal();startRest();state.timer=120;render()">◷  Aggiornamento dei timer di riscaldamento</button><button onclick="replaceExercise(${m.ei})">↻  Sostituisci esercizio</button><button onclick="closeModal();toast('Superset creato')">⛓  Creare un superset</button><button onclick="closeModal();toast('Preferenze aperte')">⚙  Preferenze</button><button class="danger" onclick="removeExercise(${m.ei})">×  Rimuovi esercizio</button></div></div></div>`}else if(m.type==='workout'){html=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grab"></div><h3>Allenamento</h3><div class="menu"><button onclick="closeModal();toast('Nota aggiunta')">▣  Aggiungi nota</button><button onclick="closeModal();toast('Nota adesiva aggiunta')">▣  Aggiungi nota adesiva</button><button onclick="closeModal();startRest();state.timer=120;render()">◷  Timer di recupero</button><button onclick="closeModal();openLibrary()">＋  Aggiungi esercizio</button><button onclick="closeModal();toast('Preferenze')">⚙  Preferenze</button><button class="danger" onclick="cancelWorkout()">×  Annulla allenamento</button></div></div></div>`}else if(m.type==='categories'){html=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grab"></div><h3>Seleziona categoria</h3><div class="catGrid">${['Qualsiasi categoria','Core','Arms','Back','Chest','Legs','Shoulders','Other','Olympic','Full Body','Cardio'].map(c=>`<button class="cat" onclick="filterCat('${c}')">${c}</button>`).join('')}</div></div></div>`}$('modal').innerHTML=html}
function replaceExercise(ei){state.modal={type:'replace',ei};$('modal').innerHTML=`<div class="overlay"><div class="sheet"><div class="grab"></div><h3>Sostituisci esercizio</h3><input class="search" placeholder="Ricerca" oninput="replaceList(this.value,${ei})"><div id="replaceList" class="list">${replaceItems('',ei)}</div></div></div>`}function replaceItems(q,ei){return exercises.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(q.toLowerCase())).map(e=>`<button class="item" onclick="doReplace(${ei},'${e[0].replace(/'/g,"\\'")}')"><span class="ico">${e[2]}</span><span><strong>${esc(e[0])}</strong><small>${esc(e[1])}</small></span></button>`).join('')}function replaceList(q,ei){$('replaceList').innerHTML=replaceItems(q,ei)}function doReplace(ei,name){state.workout.exercises[ei].name=name;closeModal();render()}function removeExercise(ei){state.workout.exercises.splice(ei,1);closeModal();render();toast('Esercizio rimosso')}function filterCat(c){closeModal();state.filter=c==='Qualsiasi categoria'?'':c;openLibrary()}
function closeModal(){state.modal=null;renderModal()}function cancelWorkout(){clearInterval(tick);state.workout=null;state.timer=0;state.screen='home';closeModal();render()}function finishWorkout(){let sets=state.workout.exercises.flatMap(e=>e.sets.filter(s=>s.done));if(!sets.length){toast('Completa almeno una serie');return}history.push({name:state.workout.name,date:new Date().toISOString(),exercises:state.workout.exercises,sets:sets.length});localStorage.setItem('forge_history',JSON.stringify(history));toast('Allenamento salvato');setTimeout(()=>{state.workout=null;state.screen='history';render()},500)}
function go(s){state.screen=s;render()}function historyPage(){return `<div class="app"><h1 class="title" style="margin-bottom:20px">Storico</h1>${history.length?history.slice().reverse().map(h=>`<div class="historyCard"><h3>${esc(h.name)}</h3><div class="stat"><span>${new Date(h.date).toLocaleDateString('it-IT')}</span><span>${h.sets} serie completate</span></div></div>`).join(''):'<div class="empty">I tuoi allenamenti completati appariranno qui.</div>'}</div>`}function measure(){return `<div class="app"><h1 class="title" style="margin-bottom:20px">Misura</h1><div class="measureCard"><div class="stat"><b>Peso</b><span>— kg</span></div></div><div class="measureCard"><div class="stat"><b>Progressi</b><span>Ancora nessun dato</span></div></div></div>`}function profile(){return `<div class="app"><h1 class="title" style="margin-bottom:20px">Profilo</h1><div class="measureCard"><h3 style="margin-top:0">FORGE</h3><p class="muted">Il tuo spazio per allenarti, registrare e migliorare.</p></div></div>`}function newTemplate(){toast('Creazione template pronta per il prossimo step')}
let touch=null;document.addEventListener('touchstart',e=>{let row=e.target.closest('.set');if(!row||e.target.closest('input,button'))return;touch={row,x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});document.addEventListener('touchmove',e=>{if(!touch)return;let dx=e.touches[0].clientX-touch.x,dy=e.touches[0].clientY-touch.y;if(dx<0&&Math.abs(dx)>Math.abs(dy)*1.05)touch.row.classList.add('swiping');else touch.row.classList.remove('swiping')},{passive:true});document.addEventListener('touchend',e=>{if(!touch)return;let t=touch;touch=null;let dx=e.changedTouches[0].clientX-t.x,dy=e.changedTouches[0].clientY-t.y;t.row.classList.remove('swiping');if(dx<-55&&Math.abs(dx)>Math.abs(dy)*1.15){let ei=+t.row.dataset.e,si=+t.row.dataset.s;if(state.workout&&state.workout.exercises[ei]){state.workout.exercises[ei].sets.splice(si,1);render();toast('Serie eliminata')}}},{passive:true});
render();
</script></body></html>
