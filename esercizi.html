<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>FORGE — Esercizi</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#20252a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:600px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}.head{height:70px;display:grid;grid-template-columns:90px 1fr 90px;align-items:center}.head button{border:0;background:none;font-size:22px}.blue{color:#299cf4}.muted{color:#c9c9cc}.search{height:76px;background:#f0f0f2;border-radius:18px;display:flex;align-items:center;padding:0 20px;margin-bottom:30px}.search span{font-size:31px;color:#8d9398;margin-right:13px}.search input{border:0;outline:0;background:transparent;font-size:25px;font-weight:650;width:100%;color:#777}.filters{display:grid;grid-template-columns:1fr 1fr 70px;gap:12px;margin-bottom:28px}.filter{height:62px;border:0;border-radius:16px;background:#e9eaec;font-size:18px;font-weight:750;color:#24292e;padding:0 8px}.sort{background:#299cf4;color:#fff;font-size:30px}.list{border-top:1px solid #e2e3e5}.row{min-height:108px;border-bottom:1px solid #e2e3e5;display:grid;grid-template-columns:105px 1fr 58px;align-items:center;gap:8px;padding:10px 0}.thumb{width:92px;height:88px;display:grid;place-items:center;background:linear-gradient(#fff,#f7f7f8);border-radius:12px;color:#8d969c;font-size:42px}.name{font-size:22px;font-weight:800;line-height:1.08}.cat{font-size:19px;color:#666d73;margin-top:8px}.side{text-align:center}.count{font-size:25px;color:#666d73}.info{width:47px;height:47px;border:0;border-radius:14px;background:#eaf5ff;color:#299cf4;font-size:30px;margin-top:7px}.empty{text-align:center;padding:40px;color:#777}</style></head><body><div class="app"><div class="head"><button class="blue" onclick="history.back()">× <span style="font-size:20px">Nuovo</span></button><b style="font-size:30px;text-align:center"></b><button class="muted">Aggiungi</button></div><div class="search"><span>⌕</span><input id="q" placeholder="Ricerca" oninput="filter()"></div><div class="filters"><button class="filter">Qualsiasi parte<br>del corpo</button><button class="filter">Qualsiasi<br>categoria</button><button class="filter sort" onclick="sort()">↕</button></div><div class="list" id="list"></div></div><script>const E=[["Lat Pulldown (Cable)","Dorso",86,"⇵"],["Lateral Raise (Dumbbell)","Spalle",79,"⌁"],["Bench Press (Barbell)","Petto",78,"⚑"],["Chest Press (Machine)","Petto",56,"▥"],["Incline Curl (Dumbbell)","Braccia",45,"◒"],["Leg Extension (Machine)","Gambe",45,"▱"],["Triceps Pushdown (Cable - Straight Bar)","Braccia",45,"↕"],["Incline Bench Press (Dumbbell)","Petto",42,"⚑"],["Squat (Barbell)","Gambe",41,"◈"],["Seated Cable Row","Dorso",39,"⇆"],["Hammer Curl (Dumbbell)","Braccia",37,"◒"],["Leg Press","Gambe",35,"▱"]];let a=false;function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function draw(x=E){list.innerHTML=x.map(e=>`<div class="row"><div class="thumb">${e[3]}</div><div><div class="name">${esc(e[0])}</div><div class="cat">${e[1]}</div></div><div class="side"><div class="count">${e[2]}</div><button class="info">?</button></div></div>`).join('')||'<div class="empty">Nessun esercizio trovato</div>'}function filter(){let q=document.getElementById('q').value.toLowerCase();draw(E.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(q)))}function sort(){a=!a;draw([...E].sort((x,y)=>a?x[0].localeCompare(y[0]):y[0].localeCompare(x[0])))}draw();</script></body></html>
